<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="ai.author" content="Claude Fable 5.2">
<meta name="ai.model" content="claude-fable-5-2">
<title>ヴェスパー・タイド - Claude Fable 5.2版</title>
<style>
	html, body { margin: 0; height: 100%; background: #03040a; overflow: hidden; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(() => {
	"use strict";
	// ===== 基本設定（論理解像度 960x540 を枠に合わせて拡縮） =====
	const W = 960, H = 540, TAU = Math.PI * 2;
	const cv = document.getElementById("c"), ctx = cv.getContext("2d");
	let vw = 960, vh = 600, dpr = 1, sc = 1, ox = 0, oy = 0;
	function resize() {
		// iframe がサイズ 0 で初期化されてもフォールバック値で動かす
		vw = window.innerWidth || 960;
		vh = window.innerHeight || 600;
		dpr = Math.min(window.devicePixelRatio || 1, 2);
		cv.width = Math.round(vw * dpr);
		cv.height = Math.round(vh * dpr);
		sc = Math.min(vw / W, vh / H);
		ox = (vw - W * sc) / 2;
		oy = (vh - H * sc) / 2;
	}
	addEventListener("resize", resize);
	resize();

	const rnd = (a, b) => a + Math.random() * (b - a);
	const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

	// ===== サウンド（ユーザー操作後に開始） =====
	let ac = null, master = null, nbuf = null, muted = false, lastBoom = 0;
	function initAudio() {
		if (ac) { if (ac.state === "suspended") ac.resume(); return; }
		try {
			ac = new (window.AudioContext || window.webkitAudioContext)();
			master = ac.createGain();
			master.gain.value = 0.3;
			master.connect(ac.destination);
			nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
			const d = nbuf.getChannelData(0);
			for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
		} catch (e) { ac = null; }
	}
	function tone(f, d, type, v, f2) {
		if (!ac || muted) return;
		const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
		o.type = type;
		o.frequency.setValueAtTime(f, t);
		if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
		g.gain.setValueAtTime(v, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + d);
		o.connect(g).connect(master);
		o.start(t);
		o.stop(t + d + 0.02);
	}
	function noise(d, v, fc, fc2) {
		if (!ac || muted) return;
		const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
		s.buffer = nbuf;
		fl.type = "lowpass";
		fl.frequency.setValueAtTime(fc, t);
		if (fc2) fl.frequency.exponentialRampToValueAtTime(fc2, t + d);
		g.gain.setValueAtTime(v, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + d);
		s.connect(fl).connect(g).connect(master);
		s.start(t, Math.random() * 0.5, d + 0.02);
	}
	const sfx = {
		shot: () => tone(880, 0.07, "square", 0.05, 300),
		hit: () => tone(240, 0.04, "triangle", 0.08, 120),
		boom: (big) => {
			if (frame - lastBoom < 3) return;
			lastBoom = frame;
			noise(big ? 0.7 : 0.3, big ? 0.6 : 0.35, big ? 1800 : 2600, 80);
			tone(big ? 90 : 140, big ? 0.5 : 0.2, "sine", 0.3, 30);
		},
		item: () => [660, 880, 1320].forEach((f, i) => setTimeout(() => tone(f, 0.12, "square", 0.08), i * 60)),
		shield: () => tone(300, 0.3, "sawtooth", 0.12, 1200),
		die: () => { noise(0.9, 0.7, 3000, 60); tone(400, 0.8, "sawtooth", 0.2, 40); },
		bomb: () => { noise(1.2, 0.7, 500, 6000); tone(60, 1, "sine", 0.4, 200); },
		warn: () => { tone(520, 0.3, "sawtooth", 0.12, 380); setTimeout(() => tone(520, 0.3, "sawtooth", 0.12, 380), 330); },
		charge: () => tone(120, 1.1, "sawtooth", 0.12, 900),
		beam: () => { noise(0.8, 0.5, 4000, 900); tone(70, 0.8, "square", 0.15, 50); },
		clear: () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.3, "square", 0.09), i * 130)),
		over: () => [392, 330, 262, 196].forEach((f, i) => setTimeout(() => tone(f, 0.4, "triangle", 0.15), i * 220)),
	};
	// 簡易BGM: ベース＋アルペジオ＋ハイハットをフレーム同期で鳴らす
	const CHORD = [[57, 60, 64], [53, 57, 60], [55, 59, 62], [52, 55, 59]];
	const hz = (m) => 440 * 2 ** ((m - 69) / 12);
	function bgm() {
		const sp = boss ? 6 : 8;
		if (stageT % sp) return;
		const st = (stageT / sp) | 0, c = CHORD[(st >> 4) & 3], n = st & 15;
		if (n % 2 === 0) tone(hz(c[0] - 24 + (n % 8 === 6 ? 12 : 0)), 0.14, "sawtooth", 0.09);
		if (n % 4 !== 3) tone(hz(c[[0, 1, 2, 1][n & 3]] + (n & 8 ? 12 : 0)), 0.09, "square", 0.028);
		if (n % 4 === 2) noise(0.03, 0.06, 7000);
	}

	// ===== ゲーム状態 =====
	let state = "title", frame = 0, stageT = 0, score = 0, hi = 0, lives = 3, bombs = 2;
	let shake = 0, flash = 0, lockT = 0, tlIdx = 0, boss = null, warnT = 0, paused = false, bonus = 0;
	let shots = [], eb = [], ens = [], parts = [], items = [];
	const P = { x: 140, y: H / 2, power: 1, shield: false, inv: 0, cool: 0, dead: 0, tilt: 0 };
	try { hi = +localStorage.getItem("fable52-shoot-hi") || 0; } catch (e) {}
	function saveHi() {
		if (score > hi) { hi = score; try { localStorage.setItem("fable52-shoot-hi", hi); } catch (e) {} }
	}
	// 地表の高さ（スクロール位置から決まる）
	const GS = 2;
	const ground = (wx) => 38 + 18 * Math.sin(wx * 0.008) + 12 * Math.sin(wx * 0.021 + 1);

	// ===== 敵の定義 =====
	const ET = {
		drifter: { hp: 2, r: 16, sc: 100 },
		dart: { hp: 1, r: 13, sc: 150 },
		turret: { hp: 5, r: 17, sc: 200 },
		bulk: { hp: 26, r: 30, sc: 800 },
		mine: { hp: 4, r: 17, sc: 150 },
		carrier: { hp: 6, r: 20, sc: 300 },
		drone: { hp: 2, r: 12, sc: 50 },
	};
	function spawn(type, x, y, o) {
		const d = ET[type];
		ens.push(Object.assign({ type, x, y, by: y, hp: d.hp, r: d.r, t: 0, hit: 0, ph: rnd(0, TAU), amp: 55, ft: 40 + (Math.random() * 90 | 0), a: Math.PI }, o));
	}
	function shootAt(x, y, sp, off) {
		if (state !== "play" || x < 30) return;
		const a = Math.atan2(P.y - y, P.x - x) + (off || 0);
		eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5 });
	}
	const shootDir = (x, y, a, sp) => eb.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5 });
	const AI = {
		// 波打ちながら飛ぶ雑魚
		drifter(e) {
			e.x -= 3;
			e.y = e.by + Math.sin(e.t * 0.05 + e.ph) * e.amp;
			if (e.t === e.ft && Math.random() < 0.5) shootAt(e.x, e.y, 3.6);
		},
		// 狙いを定めて突進
		dart(e) {
			if (e.t < 34) {
				e.x -= 4.5;
				e.a = Math.atan2(P.y - e.y, Math.min(P.x - e.x, -140));
			} else {
				e.x += Math.cos(e.a) * 8.5;
				e.y += Math.sin(e.a) * 8.5;
			}
		},
		// 地表の砲台
		turret(e) {
			e.x -= GS;
			e.y = H - ground(frame * GS + e.x) - 8;
			if (e.x < W - 10 && e.t % 85 === 40) shootAt(e.x, e.y - 10, 3.2);
		},
		// 大型機: 居座って3方向弾
		bulk(e) {
			if (e.t < 600) e.x += (W - 190 - e.x) * 0.03; else e.x -= 2.2;
			e.y = e.by + Math.sin(e.t * 0.02) * 70;
			if (e.t > 60 && e.t < 600 && e.t % 75 === 0) for (let k = -1; k <= 1; k++) shootAt(e.x - 24, e.y, 3.4, k * 0.22);
		},
		// 機雷: 壊すと弾をばらまく
		mine(e) { e.x -= 1.7; e.y = e.by + Math.sin(e.t * 0.03 + e.ph) * 24; },
		// 補給船: 必ずアイテムを落とす
		carrier(e) { e.x -= 2.2; e.y = e.by + Math.sin(e.t * 0.03) * 40; },
		// ボスの子機
		drone(e) { e.x -= 3.6; e.y += clamp((P.y - e.y) * 0.03, -2.2, 2.2); },
	};

	// ===== ステージ進行表（秒, 処理） =====
	const TL = [];
	const at = (t, f) => TL.push([(t * 60) | 0, f]);
	const wave = (t, type, n, gap, y, o) => {
		for (let i = 0; i < n; i++) at(t + i * gap, () => spawn(type, W + 40, typeof y === "function" ? y(i) : y, o));
	};
	wave(2, "drifter", 5, 0.4, 140);
	wave(6, "drifter", 5, 0.4, 360);
	wave(10, "dart", 4, 0.5, (i) => 90 + i * 100);
	wave(13, "turret", 2, 1.6, 0);
	wave(15.5, "drifter", 6, 0.35, 250, { amp: 110 });
	at(17, () => spawn("carrier", W + 40, 200));
	at(21, () => spawn("bulk", W + 60, 210));
	wave(24, "dart", 6, 0.4, (i) => 420 - i * 68);
	wave(27, "turret", 3, 1.3, 0);
	wave(28, "drifter", 5, 0.4, 120);
	wave(32, "mine", 5, 0.7, (i) => 100 + ((i * 173) % 320));
	at(36, () => { spawn("bulk", W + 60, 150); spawn("bulk", W + 60, 350); });
	at(40, () => spawn("carrier", W + 40, 280));
	wave(42, "drifter", 6, 0.35, 130);
	wave(42.2, "drifter", 6, 0.35, 370);
	wave(45, "dart", 5, 0.35, (i) => 110 + i * 75);
	wave(48, "mine", 4, 0.8, (i) => 360 - i * 80);
	wave(49, "turret", 4, 1.2, 0);
	at(53, () => spawn("bulk", W + 60, 240));
	wave(54, "dart", 6, 0.45, (i) => (i % 2 ? 110 : 400));
	wave(58, "drifter", 8, 0.28, 240, { amp: 150 });
	at(62, () => spawn("carrier", W + 40, 160));
	at(64, () => { spawn("bulk", W + 60, 130); spawn("bulk", W + 60, 370); });
	wave(65, "mine", 4, 0.8, (i) => 150 + i * 70);
	wave(68, "dart", 5, 0.3, (i) => 430 - i * 80);
	at(73, () => { warnT = 200; });
	TL.sort((a, b) => a[0] - b[0]);
	const STAGE_LEN = 73 * 60;

	function startGame() {
		state = "play";
		score = 0; lives = 3; bombs = 2; stageT = 0; tlIdx = 0; boss = null; warnT = 0; bonus = 0; paused = false;
		shots = []; eb = []; ens = []; parts = []; items = [];
		Object.assign(P, { x: 140, y: H / 2 - 30, power: 1, shield: false, inv: 120, cool: 0, dead: 0, tilt: 0 });
	}

	// ===== エフェクト =====
	function boom(x, y, r) {
		const n = Math.min(40, r * 0.9) | 0;
		for (let i = 0; i < n && parts.length < 500; i++) {
			const a = rnd(0, TAU), s = rnd(0.5, 1) * (2 + r * 0.12), l = rnd(18, 40) | 0;
			parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: l, max: l, size: rnd(2, 5) + r * 0.08, c: ["#fff3b0", "#ffb347", "#ff6a3d", "#ffffff"][i & 3] });
		}
		parts.push({ x, y, vx: 0, vy: 0, life: 22, max: 22, size: r * 2.6, ring: 1, c: "#ffd9a0" });
		sfx.boom(r > 28);
		shake = Math.max(shake, Math.min(20, r / 3));
	}
	function spark(x, y) {
		for (let i = 0; i < 3; i++) parts.push({ x, y, vx: rnd(-3, 1), vy: rnd(-2, 2), life: 10, max: 10, size: 2.5, c: "#bff" });
	}

	// ===== 自機まわり =====
	function fire() {
		const p = P.power;
		const s = (dy, a) => shots.push({ x: P.x + 18, y: P.y + dy, vx: Math.cos(a) * 16, vy: Math.sin(a) * 16, a });
		if (p === 1) s(0, 0);
		else { s(-6, 0); s(6, 0); }
		if (p >= 4) s(0, 0);
		if (p >= 3) { s(-9, -0.14); s(9, 0.14); }
		if (p >= 5) { s(-11, -0.32); s(11, 0.32); }
		P.cool = p >= 5 ? 6 : 7;
		sfx.shot();
	}
	function bomb() {
		if (state !== "play" || paused || P.dead || bombs <= 0) return;
		bombs--;
		eb = [];
		for (const e of ens) hurt(e, 30);
		if (boss) hurtBoss(40);
		flash = 24; shake = 20;
		P.inv = Math.max(P.inv, 100);
		for (let i = 0; i < 3; i++) parts.push({ x: P.x, y: P.y, vx: 0, vy: 0, life: 40 + i * 12, max: 40 + i * 12, size: 1200, ring: 1, c: "#9ff" });
		sfx.bomb();
	}
	function playerHit() {
		if (P.shield) {
			P.shield = false; P.inv = 70;
			parts.push({ x: P.x, y: P.y, vx: 0, vy: 0, life: 20, max: 20, size: 120, ring: 1, c: "#7ef" });
			sfx.shield();
			return;
		}
		boom(P.x, P.y, 30);
		sfx.die();
		lives--;
		P.dead = 70;
		P.power = Math.max(1, P.power - 1);
		eb = [];
	}
	function pick(it) {
		score += 100;
		if (it.k === "P") { if (P.power < 5) P.power++; else score += 2000; }
		else if (it.k === "S") P.shield = true;
		else bombs = Math.min(5, bombs + 1);
		parts.push({ x: it.x, y: it.y, vx: 0, vy: 0, life: 16, max: 16, size: 80, ring: 1, c: "#fff" });
		sfx.item();
	}
	function hurt(e, d) {
		if (e.dead) return;
		e.hp -= d; e.hit = 4;
		if (e.hp > 0) { sfx.hit(); return; }
		e.dead = 1;
		score += ET[e.type].sc;
		boom(e.x, e.y, e.r);
		if (e.type === "mine" && state === "play") for (let i = 0; i < 8; i++) shootDir(e.x, e.y, i * TAU / 8 + 0.4, 2.6);
		const sure = e.type === "carrier" || e.type === "bulk";
		if (sure || (e.type !== "drone" && Math.random() < 0.05)) {
			const k = P.power < 5 && Math.random() < 0.6 ? "P" : Math.random() < 0.55 ? "S" : "B";
			items.push({ x: e.x, y: e.y, k, t: 0 });
		}
	}

	// ===== ボス =====
	function spawnBoss() { boss = { x: W + 170, y: H / 2 - 30, hp: 520, max: 520, t: 0, pt: 0, r: 56, hit: 0, beam: 0, dying: 0, ph: 0 }; }
	function hurtBoss(d) {
		const b = boss;
		if (b.dying || b.x > W - 168) return;
		b.hp -= d; b.hit = 3; score += 10;
		if (b.hp <= 0) {
			b.dying = 1; b.beam = 0; eb = [];
			for (const e of ens) hurt(e, 99);
			score += 20000;
		}
	}
	function updBoss() {
		const b = boss;
		b.t++;
		if (b.hit > 0) b.hit--;
		if (b.dying) {
			// 連鎖爆発のあと撃沈
			b.dying++; b.y += 0.5;
			if (b.dying % 7 === 0) boom(b.x + rnd(-90, 90), b.y + rnd(-70, 70), rnd(18, 40));
			if (b.dying > 150) {
				boom(b.x, b.y, 90); flash = 30;
				boss = null;
				if (state === "play") {
					bonus = lives * 5000 + bombs * 2000;
					score += bonus;
					state = "clear"; lockT = 120;
					saveHi(); sfx.clear();
				}
			}
			return;
		}
		if (b.x > W - 170) { b.x -= 1.5; return; }
		const ph = b.hp > b.max * 0.66 ? 0 : b.hp > b.max * 0.33 ? 1 : 2;
		if (ph !== b.ph) { b.ph = ph; b.pt = 0; b.beam = 0; eb = []; boom(b.x - 30, b.y, 44); }
		b.pt++;
		if (b.beam > 0) {
			b.beam--;
			if (b.beam === 50) sfx.beam();
		} else b.y += (H / 2 - 40 + Math.sin(b.t * 0.017) * 165 - b.y) * 0.04;
		const mx = b.x - 62;
		if (ph === 0) {
			// 第1形態: 扇状の狙い弾＋子機
			if (b.pt % 55 === 0) for (let k = -2; k <= 2; k++) shootAt(mx, b.y, 3.6, k * 0.2);
			if (b.pt % 240 === 120) { spawn("drone", b.x - 20, b.y - 70); spawn("drone", b.x - 20, b.y + 70); }
		} else if (ph === 1) {
			// 第2形態: 回転する渦巻き弾
			if (b.pt % 5 === 0 && state === "play") { const a = b.pt * 0.11; shootDir(b.x - 10, b.y, a, 3.1); shootDir(b.x - 10, b.y, a + Math.PI, 3.1); }
			if (b.pt % 110 === 0) for (let k = -1; k <= 1; k++) shootAt(mx, b.y, 5, k * 0.12);
		} else {
			// 第3形態: 予告つき極太ビーム＋リング弾
			const c = b.pt % 260;
			if (c === 150) { b.beam = 120; sfx.charge(); }
			if (!b.beam && c % 42 === 0 && state === "play") for (let i = 0; i < 14; i++) shootDir(b.x - 10, b.y, i * TAU / 14 + b.pt * 0.03, 2.9);
			if (b.pt % 300 === 60) { spawn("drone", b.x - 20, b.y - 70); spawn("drone", b.x - 20, b.y + 70); }
		}
	}

	// ===== 更新 =====
	function update() {
		frame++;
		if (shake > 0) shake--;
		if (flash > 0) flash--;
		if (lockT > 0) lockT--;
		if (state === "title") return;
		if (state === "play") {
			stageT++;
			bgm();
			while (tlIdx < TL.length && TL[tlIdx][0] <= stageT) TL[tlIdx++][1]();
			if (warnT > 0) {
				warnT--;
				if (warnT % 44 === 43) sfx.warn();
				if (!warnT) spawnBoss();
			}
			updPlayer();
		} else if (state === "clear") { P.x += 7; P.tilt *= 0.9; }
		// 自機弾
		for (const s of shots) {
			s.x += s.vx; s.y += s.vy;
			if (s.x > W + 20 || s.y < -20 || s.y > H + 20) s.dead = 1;
		}
		// 敵
		for (const e of ens) {
			e.t++;
			if (e.hit > 0) e.hit--;
			AI[e.type](e);
			if (e.x < -80 || e.y < -120 || e.y > H + 120) e.dead = 1;
		}
		if (boss) updBoss();
		for (const b of eb) {
			b.x += b.vx; b.y += b.vy;
			if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > H + 20) b.dead = 1;
		}
		// 自機弾 → 敵
		for (const s of shots) {
			if (s.dead) continue;
			for (const e of ens) {
				if (!e.dead && Math.abs(s.x - e.x) < e.r + 9 && Math.abs(s.y - e.y) < e.r + 4) { s.dead = 1; hurt(e, 1); spark(s.x, s.y); break; }
			}
			if (!s.dead && boss && !boss.dying && Math.abs(s.x - boss.x) < boss.r + 10 && Math.abs(s.y - boss.y) < boss.r) { s.dead = 1; hurtBoss(1); spark(s.x, s.y); }
		}
		// 自機の被弾
		if (state === "play" && !P.dead && P.inv <= 0) {
			let hit = false;
			for (const b of eb) if (!b.dead && Math.hypot(b.x - P.x, b.y - P.y) < b.r + 3) { b.dead = 1; hit = true; break; }
			if (!hit) for (const e of ens) if (!e.dead && Math.hypot(e.x - P.x, e.y - P.y) < e.r + 7) { hit = true; hurt(e, 3); break; }
			if (!hit && boss && !boss.dying) {
				if (Math.hypot(boss.x - P.x, boss.y - P.y) < boss.r + 8) hit = true;
				if (boss.beam > 0 && boss.beam <= 50 && Math.abs(P.y - boss.y) < 17 && P.x < boss.x - 50) hit = true;
			}
			if (hit) playerHit();
		}
		// アイテム
		for (const it of items) {
			it.x -= 1.6; it.t++;
			it.y += Math.sin(it.t * 0.07) * 0.8;

	function drawBG() {

	function drawOverlay() {
		if (state === "title") {
			ctx.fillStyle = "rgba(3,4,14,.35)"; ctx.fillRect(0, 0, W, H);
			const g = ctx.createLinearGradient(0, 130, 0, 215);
			g.addColorStop(0, "#fff"); g.addColorStop(0.5, "#7fe6ff"); g.addColorStop(1, "#b06aff");
			ctx.save();
			ctx.shadowColor = "#5b7cff"; ctx.shadowBlur = 30;
			text("VESPER TIDE", W / 2, 200, 84, g, "center", "italic 900");
			ctx.restore();
			text("ヴェスパー・タイド 〜 宵 の 星 潮 〜", W / 2, 240, 18, "#cfd8ff", "center", "normal");
			drawShip(W / 2 - 10 + Math.sin(frame * 0.03) * 16, 300 + Math.sin(frame * 0.05) * 6, Math.cos(frame * 0.05) * 0.4, 1.6);
			if ((frame >> 5) & 1) text("SPACE / クリック / タップ でスタート", W / 2, 380, 20, "#fff", "center");
			text("敵編隊を突破し、最深部の「深潮機」を撃破せよ", W / 2, 420, 14, "#9fb0e8", "center", "normal");
			text("P: パワーアップ   S: シールド   B: ボム補充", W / 2, 444, 14, "#9fb0e8", "center", "normal");
		} else if (state === "over") {
			panel("GAME OVER", "#ff5a6a", ["SCORE  " + pad(score), lockT > 0 ? "" : "Space / タップ でもう一度"]);
		} else if (state === "clear" && lockT < 70) {
			panel("STAGE CLEAR", "#7fe6ff", ["SCORE  " + pad(score), "クリアボーナス  +" + bonus + "（残機・ボム）", lockT > 0 ? "" : "Space / タップ でもう一度"]);
		} else if (paused) panel("PAUSE", "#fff", ["", "P で再開"]);
	}

	function draw() {
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.fillStyle = "#03040a";
		ctx.fillRect(0, 0, cv.width, cv.height);
		const sx = shake ? rnd(-shake, shake) * 0.5 : 0, sy = shake ? rnd(-shake, shake) * 0.5 : 0;
		ctx.setTransform(sc * dpr, 0, 0, sc * dpr, ox * dpr, oy * dpr);
		ctx.save();
		ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
		ctx.translate(sx, sy);
		drawWorld();
		ctx.translate(-sx, -sy);
		if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 40})`; ctx.fillRect(0, 0, W, H); }
		drawHUD();
		drawOverlay();
		ctx.restore();
	}

	// ===== メインループ（60Hz 固定ステップ） =====
	let last = 0, acc = 0;
	function loop(t) {
		requestAnimationFrame(loop);
		// 画面サイズ 0 で初期化された場合の復帰
		if ((window.innerWidth || 960) !== vw || (window.innerHeight || 600) !== vh) resize();
		acc += Math.min(100, t - last);
		last = t;
		while (acc >= 1000 / 60) {
			acc -= 1000 / 60;
			if (!paused) update();
		}
		draw();
	}
	requestAnimationFrame(loop);

	// 動作確認用フック
	window.__dbg = {
		get s() { return { state, score, lives, bombs, stageT, power: P.power, px: P.x, py: P.y, inv: P.inv, ens: ens.length, eb: eb.length, shots: shots.length, boss: boss ? { hp: boss.hp, ph: boss.ph, x: boss.x, dying: boss.dying } : null }; },
		step(n) { for (let i = 0; i < n; i++) update(); },
		P,
	};
})();
</script>
