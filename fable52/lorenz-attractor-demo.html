<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ai.author" content="Claude Fable 5.2">
<meta name="ai.model" content="claude-fable-5-2">
<title>ローレンツ・アトラクタ - Claude Fable 5.2版</title>
<style>
	html, body {
		margin: 0; height: 100%; overflow: hidden;
		background: radial-gradient(ellipse at 50% 45%, #121a33 0%, #070a17 60%, #020308 100%);
		font: 12px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; color: #cfd8f0;
	}
	canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
	canvas.drag { cursor: grabbing; }
	#panel {
		position: fixed; left: 12px; top: 12px; width: 212px; padding: 10px 12px 8px;
		background: rgba(10, 14, 30, .62); border: 1px solid rgba(140, 160, 220, .2); border-radius: 10px;
		backdrop-filter: blur(6px); user-select: none;
	}
	#panel h1 { margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: .08em; color: #e8eeff; }
	.row { display: grid; grid-template-columns: 18px 1fr 44px; align-items: center; gap: 6px; }
	.row i { font: italic 15px Georgia, "Times New Roman", serif; color: #9fd0ff; }
	.row output { text-align: right; font-variant-numeric: tabular-nums; color: #fff; }
	input[type=range] { width: 100%; accent-color: #7fb2ff; margin: 3px 0; }
	.btns { display: flex; gap: 6px; margin-top: 6px; }
	button {
		flex: 1; font: inherit; color: #dfe7ff; background: rgba(120, 150, 230, .16);
		border: 1px solid rgba(150, 175, 240, .3); border-radius: 6px; padding: 3px 0; cursor: pointer;
	}
	button:hover { background: rgba(120, 150, 230, .34); }
	#eq { margin-top: 7px; font: italic 11px/1.5 Georgia, serif; color: rgba(190, 205, 240, .6); }
	.hud { position: fixed; bottom: 12px; color: rgba(200, 212, 240, .5); pointer-events: none; letter-spacing: .04em; }
	#hint { left: 14px; }
	#credit { right: 14px; color: rgba(200, 212, 240, .36); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
	<h1>LORENZ ATTRACTOR</h1>
	<div class="row"><i>σ</i><input id="s" type="range" min="1" max="30" step="0.1" value="10"><output id="so"></output></div>
	<div class="row"><i>ρ</i><input id="r" type="range" min="1" max="60" step="0.1" value="28"><output id="ro"></output></div>
	<div class="row"><i>β</i><input id="b" type="range" min="0.3" max="5" step="0.01" value="2.67"><output id="bo"></output></div>
	<div class="row"><i>⏱</i><input id="v" type="range" min="1" max="16" step="1" value="6"><output id="vo"></output></div>
	<div class="btns"><button id="reset">リセット</button><button id="spin">自動回転：ON</button></div>
	<div id="eq">ẋ = σ(y − x)　ẏ = x(ρ − z) − y　ż = xy − βz</div>
</div>
<div class="hud" id="hint">ドラッグ：回転　ホイール：ズーム　Space：一時停止　R：リセット　／　2本の軌跡は初期値が 0.001 だけ違う</div>
<div class="hud" id="credit">Claude Fable 5.2</div>
<script>
(() => {
	"use strict";
	const TAU = Math.PI * 2;
	const cv = document.getElementById("c");
	const ctx = cv.getContext("2d");
	const $ = (id) => document.getElementById(id);

	const N = 2800;			// 軌跡1本あたりの保持点数
	const DT = 0.006;		// 積分の刻み幅
	const CHUNK = 28;		// 何点ごとに色を変えるか
	const P = { s: 10, r: 28, b: 8 / 3 };
	let W = 0, H = 0, dpr = 1;
	let yaw = 0.6, pitch = 0.22, zoom = 1, auto = true, paused = false, dragging = false;
	let zc = 27;			// 注視点の高さ（ρ に合わせてなめらかに動く）

	// 軌跡：リングバッファに 3D 座標を貯める
	function makeTrail(x0, h0, h1) {
		return { p: new Float32Array(N * 3), head: 0, len: 0, x: x0, y: 0, z: 20, x0, h0, h1 };
	}
	const trails = [makeTrail(1, 185, 285), makeTrail(1.001, 48, -12)];
	const SX = new Float32Array(N), SY = new Float32Array(N);

	function resetTrails() {
		for (const t of trails) { t.x = t.x0; t.y = 0; t.z = 20; t.head = 0; t.len = 0; }
	}

	// ---- 4次ルンゲ＝クッタ法でローレンツ方程式を積分 ----
	const k1 = [0, 0, 0], k2 = [0, 0, 0], k3 = [0, 0, 0], k4 = [0, 0, 0];
	function f(x, y, z, o) {
		o[0] = P.s * (y - x);
		o[1] = x * (P.r - z) - y;
		o[2] = x * y - P.b * z;
	}
	function advance(t) {
		const h = DT, x = t.x, y = t.y, z = t.z;
		f(x, y, z, k1);
		f(x + k1[0] * h / 2, y + k1[1] * h / 2, z + k1[2] * h / 2, k2);
		f(x + k2[0] * h / 2, y + k2[1] * h / 2, z + k2[2] * h / 2, k3);
		f(x + k3[0] * h, y + k3[1] * h, z + k3[2] * h, k4);
		t.x = x + h / 6 * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]);
		t.y = y + h / 6 * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]);
		t.z = z + h / 6 * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]);
		// 発散したら安全のため初期値へ戻す
		if (!(Math.abs(t.x) < 1e4 && Math.abs(t.y) < 1e4 && Math.abs(t.z) < 1e4)) { t.x = t.x0; t.y = 0; t.z = 20; t.len = 0; }
		const i = t.head * 3;
		t.p[i] = t.x; t.p[i + 1] = t.y; t.p[i + 2] = t.z;
		t.head = (t.head + 1) % N;
		if (t.len < N) t.len++;
	}

	// ---- 3D → 2D 投影（z 軸が上） ----
	let cy = 1, sy = 0, cp = 1, sp = 0, scale = 1;
	const out = [0, 0, 0];
	function project(x, y, z) {
		const x1 = x * cy - y * sy, y1 = x * sy + y * cy, z1 = z - zc;
		const depth = y1 * cp + z1 * sp;		// 奥行き
		const up = z1 * cp - y1 * sp;
		const f = 150 / (150 + depth);
		out[0] = W / 2 + x1 * scale * f;
		out[1] = H / 2 - up * scale * f;
		out[2] = f;
	}

	function drawTrail(t) {
		const n = t.len;
		if (n < 2) return;
		const start = (t.head - n + N) % N;
		for (let j = 0; j < n; j++) {
			const i = ((start + j) % N) * 3;
			project(t.p[i], t.p[i + 1], t.p[i + 2]);
			SX[j] = out[0]; SY[j] = out[1];
		}
		// 古い部分ほど淡く、色相を変えながら小分けに描く
		for (let j0 = 0; j0 < n - 1; j0 += CHUNK) {
			const j1 = Math.min(n - 1, j0 + CHUNK);
			const a = (j1 + N - n) / N;		// 0 = 最古, 1 = 最新
			ctx.strokeStyle = `hsla(${t.h0 + (t.h1 - t.h0) * a},92%,${52 + 16 * a}%,${0.06 + 0.8 * a * a})`;
			ctx.lineWidth = 0.9 + 0.8 * a;
			ctx.beginPath();
			ctx.moveTo(SX[j0], SY[j0]);
			for (let j = j0 + 1; j <= j1; j++) ctx.lineTo(SX[j], SY[j]);
			ctx.stroke();
		}
		// 先頭の光点
		const hx = SX[n - 1], hy = SY[n - 1];
		const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 14);
		g.addColorStop(0, `hsla(${t.h1},100%,88%,.95)`);
		g.addColorStop(0.25, `hsla(${t.h1},100%,65%,.4)`);
		g.addColorStop(1, `hsla(${t.h1},100%,60%,0)`);
		ctx.fillStyle = g;
		ctx.beginPath(); ctx.arc(hx, hy, 14, 0, TAU); ctx.fill();
	}

	// 座標軸と不動点（2つの「目」の中心）を控えめに描く
	function drawGuides() {
		ctx.lineWidth = 1;
		const L = 22;
		const axes = [[L, 0, 0, "x"], [0, L, 0, "y"], [0, 0, L, "z"]];
		ctx.font = "italic 12px Georgia, serif";
		for (const [x, y, z, name] of axes) {
			project(0, 0, zc); const ox = out[0], oy = out[1];
			project(x, y, z + zc);
			ctx.strokeStyle = "rgba(150,170,220,.16)";
			ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(out[0], out[1]); ctx.stroke();
			ctx.fillStyle = "rgba(170,190,235,.42)";
			ctx.fillText(name, out[0] + 4, out[1] - 4);
		}
		if (P.r > 1) {
			const q = Math.sqrt(P.b * (P.r - 1));
			for (const s of [1, -1]) {
				project(s * q, s * q, P.r - 1);
				ctx.strokeStyle = "rgba(255,255,255,.4)";
				ctx.beginPath(); ctx.arc(out[0], out[1], 3.5 * out[2], 0, TAU); ctx.stroke();
			}
		}
	}

	function frame() {
		requestAnimationFrame(frame);
		if (!W) { resize(); return; }
		if (!paused) {
			const steps = +$("v").value;
			for (let k = 0; k < steps; k++) for (const t of trails) advance(t);
		}
		if (auto && !dragging) yaw += 0.0035;
		zc += (Math.max(8, P.r - 1) - zc) * 0.05;
		cy = Math.cos(yaw); sy = Math.sin(yaw); cp = Math.cos(pitch); sp = Math.sin(pitch);
		scale = Math.min(W, H) / 62 * zoom;

		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		ctx.clearRect(0, 0, W, H);
		ctx.globalCompositeOperation = "source-over";
		drawGuides();
		ctx.globalCompositeOperation = "lighter";	// 重なるほど明るく光る
		ctx.lineJoin = ctx.lineCap = "round";
		for (const t of trails) drawTrail(t);
	}

	// ---- 画面サイズへの追従 ----
	function resize() {
		const w = window.innerWidth || 960, h = window.innerHeight || 600;
		const d = Math.min(window.devicePixelRatio || 1, 2);
		if (w === W && h === H && d === dpr) return;
		W = w; H = h; dpr = d;
		cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
	}
	window.addEventListener("resize", resize);
	if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);

	// ---- パラメータ UI ----
	function syncUI() {
		P.s = +$("s").value; P.r = +$("r").value; P.b = +$("b").value;
		$("so").value = P.s.toFixed(1); $("ro").value = P.r.toFixed(1); $("bo").value = P.b.toFixed(2);
		$("vo").value = "×" + $("v").value;
	}
	for (const id of ["s", "r", "b", "v"]) $(id).addEventListener("input", syncUI);
	function reset() {
		$("s").value = 10; $("r").value = 28; $("b").value = 2.67; $("v").value = 6;
		syncUI(); resetTrails();
		yaw = 0.6; pitch = 0.22; zoom = 1;
	}
	$("reset").addEventListener("click", reset);
	$("spin").addEventListener("click", () => { auto = !auto; $("spin").textContent = "自動回転：" + (auto ? "ON" : "OFF"); });

	// ---- ドラッグ回転・ズーム・キー操作 ----
	let lx = 0, ly = 0;
	cv.addEventListener("pointerdown", (e) => {
		window.focus();
		dragging = true; lx = e.clientX; ly = e.clientY;
		cv.classList.add("drag");
		try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 無視 */ }
	});
	cv.addEventListener("pointermove", (e) => {
		if (!dragging) return;
		yaw += (e.clientX - lx) * 0.008;
		pitch = Math.max(-1.5, Math.min(1.5, pitch + (e.clientY - ly) * 0.008));
		lx = e.clientX; ly = e.clientY;
	});
	const end = () => { dragging = false; cv.classList.remove("drag"); };
	cv.addEventListener("pointerup", end);
	cv.addEventListener("pointercancel", end);
	cv.addEventListener("wheel", (e) => {
		e.preventDefault();
		zoom = Math.max(0.3, Math.min(5, zoom * Math.exp(-e.deltaY * 0.0012)));
	}, { passive: false });
	window.addEventListener("keydown", (e) => {
		if (e.target.tagName === "INPUT" && e.code.startsWith("Arrow")) return;	// スライダーの矢印キー操作はそのまま
		if (e.code === "Space") { e.preventDefault(); paused = !paused; }
		else if (e.code === "KeyR") reset();
		else if (e.code === "ArrowLeft") { e.preventDefault(); yaw -= 0.08; }
		else if (e.code === "ArrowRight") { e.preventDefault(); yaw += 0.08; }
		else if (e.code === "ArrowUp") { e.preventDefault(); pitch = Math.min(1.5, pitch + 0.06); }
		else if (e.code === "ArrowDown") { e.preventDefault(); pitch = Math.max(-1.5, pitch - 0.06); }
	});

	resize();
	syncUI();
	// 開いた瞬間から形が見えるよう、少し先まで計算しておく
	for (let k = 0; k < 1500; k++) for (const t of trails) advance(t);
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
