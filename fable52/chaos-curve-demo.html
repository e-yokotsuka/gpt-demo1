<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ai.author" content="Claude Fable 5.2">
<meta name="ai.model" content="claude-fable-5-2">
<title>カオス曲線 - Claude Fable 5.2版</title>
<style>
	html, body {
		margin: 0; height: 100%; overflow: hidden; background: #07070c;
		font: 12px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; color: #d6d9e6;
	}
	canvas { display: block; width: 100%; height: 100%; cursor: pointer; touch-action: none; }
	#panel {
		position: fixed; left: 12px; top: 12px; padding: 9px 12px; min-width: 190px;
		background: rgba(8, 8, 16, .55); border: 1px solid rgba(255, 255, 255, .12); border-radius: 10px;
		backdrop-filter: blur(5px); user-select: none;
	}
	#name { font-size: 13px; font-weight: 600; letter-spacing: .1em; color: #fff; }
	#eq { margin: 3px 0 5px; font: italic 12px/1.5 Georgia, "Times New Roman", serif; color: rgba(225, 228, 245, .75); white-space: pre; }
	#prm { font: 11px/1.5 Consolas, Menlo, monospace; color: rgba(190, 220, 255, .85); white-space: pre; }
	#cnt { font: 11px Consolas, Menlo, monospace; color: rgba(255, 255, 255, .4); }
	.btns { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
	button {
		font: inherit; color: #e3e6f5; background: rgba(255, 255, 255, .08);
		border: 1px solid rgba(255, 255, 255, .2); border-radius: 6px; padding: 2px 9px; cursor: pointer;
	}
	button:hover { background: rgba(255, 255, 255, .2); }
	button.on { background: rgba(130, 170, 255, .32); border-color: rgba(160, 190, 255, .6); }
	.hud { position: fixed; bottom: 12px; color: rgba(220, 224, 240, .5); pointer-events: none; letter-spacing: .04em; }
	#hint { left: 14px; }
	#credit { right: 14px; color: rgba(220, 224, 240, .36); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
	<div id="name"></div>
	<div id="eq"></div>
	<div id="prm"></div>
	<div id="cnt"></div>
	<div class="btns">
		<button data-t="0">Clifford</button><button data-t="1">de Jong</button><button data-t="2">Svensson</button>
	</div>
	<div class="btns"><button id="next">次の模様</button><button id="auto" class="on">自動</button></div>
</div>
<div class="hud" id="hint">クリック / Space：新しい模様　ドラッグ・矢印キー：a, b を少しずつ変える　1〜3：数式の切替</div>
<div class="hud" id="credit">Claude Fable 5.2</div>
<script>
(() => {
	"use strict";
	const cv = document.getElementById("c");
	const ctx = cv.getContext("2d");
	const $ = (id) => document.getElementById(id);

	// 3種類のストレンジアトラクタ（2次元の反復写像）
	const TYPES = [
		{ name: "CLIFFORD", eq: "x′ = sin(a·y) + c·cos(a·x)\ny′ = sin(b·x) + d·cos(b·y)", rng: [2.4, 2.4, 1.5, 1.5] },
		{ name: "PETER DE JONG", eq: "x′ = sin(a·y) − cos(b·x)\ny′ = sin(c·x) − cos(d·y)", rng: [3, 3, 3, 3] },
		{ name: "SVENSSON", eq: "x′ = d·sin(a·x) − sin(b·y)\ny′ = c·cos(a·x) + cos(b·y)", rng: [3, 3, 1.6, 1.6] },
	];
	const PER_FRAME = 260000;	// 1フレームに打つ点の数
	const MAX_ITER = 9e7;		// これだけ打ったら描き込みを止める
	const SHOW_SEC = 13;		// 自動切替までの秒数

	let W = 0, H = 0;
	let den, col, img, pix;		// 密度・色情報の蓄積バッファと出力画像
	let type = 0, prm = [0, 0, 0, 0], auto = true;
	let px = 0.1, py = 0.1;		// 現在の点
	let sc = 1, ox = 0, oy = 0;	// 数式の座標 → 画素への変換
	let total = 0, born = 0, maxDen = 1;
	const lut = new Uint8Array(256 * 3);	// 色パレット

	// ---- 写像を1回適用 ----
	function mapPoint(x, y, o) {
		const a = prm[0], b = prm[1], c = prm[2], d = prm[3];
		if (type === 0) { o[0] = Math.sin(a * y) + c * Math.cos(a * x); o[1] = Math.sin(b * x) + d * Math.cos(b * y); }
		else if (type === 1) { o[0] = Math.sin(a * y) - Math.cos(b * x); o[1] = Math.sin(c * x) - Math.cos(d * y); }
		else { o[0] = d * Math.sin(a * x) - Math.sin(b * y); o[1] = c * Math.cos(a * x) + Math.cos(b * y); }
	}

	// ---- 試し打ちして、広がり（カオスらしさ）と表示範囲を調べる ----
	const tmp = [0, 0];
	function probe() {
		let x = 0.1, y = 0.1, x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
		const pts = new Float32Array(24000);
		for (let i = 0; i < 12500; i++) {
			mapPoint(x, y, tmp); x = tmp[0]; y = tmp[1];
			if (i < 500) continue;
			const k = (i - 500) * 2;
			pts[k] = x; pts[k + 1] = y;
			if (x < x0) x0 = x; if (x > x1) x1 = x;
			if (y < y0) y0 = y; if (y > y1) y1 = y;
		}
		const bw = x1 - x0, bh = y1 - y0;
		// 40×40 のマスのうち何マスに点が入ったか
		const G = 40, seen = new Uint8Array(G * G);
		let cells = 0;
		if (bw > 1e-6 && bh > 1e-6) {
			for (let k = 0; k < pts.length; k += 2) {
				const gi = Math.min(G - 1, (pts[k] - x0) / bw * G | 0) + G * Math.min(G - 1, (pts[k + 1] - y0) / bh * G | 0);
				if (!seen[gi]) { seen[gi] = 1; cells++; }
			}
		}
		return { x0, y0, bw, bh, cells };
	}

	function fit(b) {
		const bw = Math.max(b.bw, 0.2), bh = Math.max(b.bh, 0.2);
		sc = Math.min(W * 0.9 / bw, H * 0.84 / bh);
		ox = W / 2 - (b.x0 + b.bw / 2) * sc;
		oy = H / 2 - (b.y0 + b.bh / 2) * sc;
	}

	function restart() {
		den.fill(0); col.fill(0);
		total = 0; maxDen = 1; px = py = 0.1;
		born = performance.now();
		showInfo();
	}

	// ---- 模様ごとに色パレットを作る（色相をずらした2〜3色のグラデーション） ----
	function makePalette() {
		const h0 = Math.random() * 360, span = (70 + Math.random() * 150) * (Math.random() < 0.5 ? 1 : -1);
		for (let i = 0; i < 256; i++) {
			const t = i / 255;
			const h = ((h0 + span * t) % 360 + 360) % 360, s = 0.85, l = 0.5 + 0.12 * Math.sin(t * 6.28);
			// HSL → RGB
			const f = (n) => {
				const k = (n + h / 30) % 12;
				return l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
			};
			lut[i * 3] = f(0) * 255; lut[i * 3 + 1] = f(8) * 255; lut[i * 3 + 2] = f(4) * 255;
		}
	}

	// ---- 新しい模様：十分に広がるパラメータが見つかるまで引き直す ----
	function newPattern(t) {
		if (t !== undefined) type = t;
		const rng = TYPES[type].rng;
		let b = null;
		for (let n = 0; n < 300; n++) {
			for (let i = 0; i < 4; i++) prm[i] = (Math.random() * 2 - 1) * rng[i];
			if (type === 2) { prm[2] = 0.4 + Math.abs(prm[2]); prm[3] = 0.4 + Math.abs(prm[3]); }
			b = probe();
			if (b.cells > 330 && b.bw > 0.8 && b.bh > 0.8) break;
		}
		makePalette();
		fit(b);
		restart();
		document.querySelectorAll("button[data-t]").forEach((el) => el.classList.toggle("on", +el.dataset.t === type));
	}

	// パラメータの微調整（ドラッグ・矢印キー）
	function tweak(da, db) {
		prm[0] += da; prm[1] += db;
		fit(probe());
		restart();
	}

	function showInfo() {
		$("name").textContent = TYPES[type].name;
		$("eq").textContent = TYPES[type].eq;
		const f = (v) => (v < 0 ? "" : " ") + v.toFixed(3);
		$("prm").textContent = `a =${f(prm[0])}   b =${f(prm[1])}\nc =${f(prm[2])}   d =${f(prm[3])}`;
	}

	// ---- 点を打ち続けて密度を蓄積する ----
	function accumulate(n) {
		const a = prm[0], b = prm[1], c = prm[2], d = prm[3], w = W, h = H;
		let x = px, y = py, nx, ny;
		for (let i = 0; i < n; i++) {
			if (type === 0) { nx = Math.sin(a * y) + c * Math.cos(a * x); ny = Math.sin(b * x) + d * Math.cos(b * y); }
			else if (type === 1) { nx = Math.sin(a * y) - Math.cos(b * x); ny = Math.sin(c * x) - Math.cos(d * y); }
			else { nx = d * Math.sin(a * x) - Math.sin(b * y); ny = c * Math.cos(a * x) + Math.cos(b * y); }
			// 1回の移動距離を色の手がかりにする
			const dx = nx - x, dy = ny - y;
			x = nx; y = ny;
			const ix = x * sc + ox | 0, iy = y * sc + oy | 0;
			if (ix >= 0 && ix < w && iy >= 0 && iy < h) {
				const k = iy * w + ix;
				den[k]++;
				col[k] += Math.sqrt(dx * dx + dy * dy);
			}
		}
		px = x; py = y; total += n;
	}

	// ---- 密度を対数でならして色をつける ----
	function render() {
		const n = W * H, inv = 1 / Math.log(1 + maxDen);
		let mx = 1;
		for (let k = 0; k < n; k++) {
			const dn = den[k];
			if (dn === 0) { pix[k] = 0xff0c0707; continue; }
			if (dn > mx) mx = dn;
			let v = Math.log(1 + dn) * inv;
			if (v > 1) v = 1;
			let ci = col[k] / dn * 62 | 0;		// 平均移動距離 → パレット位置
			if (ci > 255) ci = 255;
			ci *= 3;
			const br = Math.pow(v, 0.72), wh = v * v * v * v * 150;	// 濃い所は白く飛ばす
			let r = 7 + lut[ci] * br + wh, g = 7 + lut[ci + 1] * br + wh, b = 12 + lut[ci + 2] * br + wh;
			if (r > 255) r = 255;
			if (g > 255) g = 255;
			if (b > 255) b = 255;
			pix[k] = 0xff000000 | (b << 16) | (g << 8) | r;
		}
		maxDen = mx;
		ctx.putImageData(img, 0, 0);
	}

	function frame(now) {
		requestAnimationFrame(frame);
		resize();
		if (auto && !dragging && now - born > SHOW_SEC * 1000) newPattern((type + 1) % 3);
		if (total < MAX_ITER) {
			accumulate(PER_FRAME);
			render();
			$("cnt").textContent = (total / 1e6).toFixed(1) + " M points";
		}
	}

	// ---- 画面サイズへの追従（重くなりすぎないよう画素数を抑える） ----
	function resize() {
		const vw = window.innerWidth || 960, vh = window.innerHeight || 600;
		const s = Math.min(1, Math.sqrt(650000 / (vw * vh)));
		const nw = Math.max(64, Math.round(vw * s)), nh = Math.max(64, Math.round(vh * s));
		if (nw === W && nh === H) return;
		W = nw; H = nh;
		cv.width = W; cv.height = H;
		den = new Uint32Array(W * H);
		col = new Float32Array(W * H);
		img = ctx.createImageData(W, H);
		pix = new Uint32Array(img.data.buffer);
		if (prm[0] === 0) newPattern();
		else { fit(probe()); restart(); }
	}
	window.addEventListener("resize", resize);
	if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);

	// ---- 操作 ----
	let dragging = false, moved = 0, lx = 0, ly = 0;
	cv.addEventListener("pointerdown", (e) => {
		window.focus();
		dragging = true; moved = 0; lx = e.clientX; ly = e.clientY;
		try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 無視 */ }
	});
	cv.addEventListener("pointermove", (e) => {
		if (!dragging) return;
		const dx = e.clientX - lx, dy = e.clientY - ly;
		moved += Math.abs(dx) + Math.abs(dy);
		lx = e.clientX; ly = e.clientY;
		if (moved > 6) tweak(dx * 0.0015, dy * 0.0015);
	});
	cv.addEventListener("pointerup", () => {
		if (dragging && moved <= 6) newPattern();	// 動かさずに離したらクリック扱い
		dragging = false;
	});
	cv.addEventListener("pointercancel", () => { dragging = false; });
	document.querySelectorAll("button[data-t]").forEach((el) => el.addEventListener("click", () => newPattern(+el.dataset.t)));
	$("next").addEventListener("click", () => newPattern());
	$("auto").addEventListener("click", () => { auto = !auto; $("auto").classList.toggle("on", auto); born = performance.now(); });
	window.addEventListener("keydown", (e) => {
		const st = e.shiftKey ? 0.05 : 0.01;
		if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); newPattern(); }
		else if (e.code === "ArrowLeft") { e.preventDefault(); tweak(-st, 0); }
		else if (e.code === "ArrowRight") { e.preventDefault(); tweak(st, 0); }
		else if (e.code === "ArrowUp") { e.preventDefault(); tweak(0, st); }
		else if (e.code === "ArrowDown") { e.preventDefault(); tweak(0, -st); }
		else if (e.key >= "1" && e.key <= "3") newPattern(+e.key - 1);
	});

	resize();
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
