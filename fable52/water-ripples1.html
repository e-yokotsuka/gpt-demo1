<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ai.author" content="Claude Fable 5.2">
<meta name="ai.model" content="claude-fable-5-2">
<title>雨の波紋 - Claude Fable 5.2版</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #050912; }
	canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
	.hud {
		position: fixed; bottom: 12px; font: 12px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
		color: rgba(210, 222, 245, .55); pointer-events: none; user-select: none; letter-spacing: .04em;
		text-shadow: 0 1px 3px rgba(0, 0, 0, .7);
	}
	#hint { left: 14px; }
	#credit { right: 14px; color: rgba(210, 222, 245, .38); }
	#rate { color: rgba(230, 238, 255, .8); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hint">クリック / なぞる：しずくを落とす　ホイール・↑↓：雨の強さ　Space：雨を止める<br>雨量 <span id="rate"></span></div>
<div class="hud" id="credit">Claude Fable 5.2</div>
<script>
(() => {
	"use strict";
	const TAU = Math.PI * 2;
	const cv = document.getElementById("c");
	const ctx = cv.getContext("2d");
	const bg = document.createElement("canvas"); // 動かない背景（空・月・山・水面の地色）のキャッシュ
	const rateEl = document.getElementById("rate");

	let W = 0, H = 0, dpr = 1, hz = 0;	// hz: 水平線の y 座標
	let moon = { x: 0, y: 0, r: 0 };
	let shimmer = [];					// 水面のかすかなきらめき
	const drops = [];					// 落下中の雨粒
	const ripples = [];					// 波紋
	const sparks = [];					// 着水時のしぶき
	let rate = 9, raining = true, acc = 0;

	// ---- 画面サイズへの追従（サイズ 0 で初期化されても復帰する） ----
	function resize() {
		const w = window.innerWidth || 960, h = window.innerHeight || 600;
		const d = Math.min(window.devicePixelRatio || 1, 2);
		if (w === W && h === H && d === dpr) return;
		W = w; H = h; dpr = d;
		cv.width = bg.width = Math.round(W * dpr);
		cv.height = bg.height = Math.round(H * dpr);
		hz = H * 0.36;
		moon = { x: W * 0.7, y: hz * 0.4, r: Math.min(W, H) * 0.042 };
		shimmer = [];
		for (let i = 0; i < 90; i++) {
			const u = Math.pow(Math.random(), 1.6);
			shimmer.push({ x: Math.random() * W, u, len: 20 + Math.random() * 90, ph: Math.random() * TAU, sp: 0.3 + Math.random() * 0.9 });
		}
		paintBackground();
	}

	// ---- 背景を一度だけ描いてキャッシュ ----
	function paintBackground() {
		const g = bg.getContext("2d");
		g.setTransform(dpr, 0, 0, dpr, 0, 0);
		// 夜空
		let gr = g.createLinearGradient(0, 0, 0, hz);
		gr.addColorStop(0, "#050817");
		gr.addColorStop(0.6, "#131c36");
		gr.addColorStop(1, "#38425f");
		g.fillStyle = gr; g.fillRect(0, 0, W, hz + 1);
		// 星
		for (let i = 0; i < 140; i++) {
			const y = Math.pow(Math.random(), 1.5) * hz * 0.85;
			g.fillStyle = `rgba(225,232,255,${0.15 + Math.random() * 0.55})`;
			g.fillRect(Math.random() * W, y, Math.random() < 0.15 ? 1.6 : 1, 1);
		}
		// 月と、そのまわりの暈
		gr = g.createRadialGradient(moon.x, moon.y, moon.r * 0.5, moon.x, moon.y, moon.r * 7);
		gr.addColorStop(0, "rgba(255,244,214,.34)");
		gr.addColorStop(0.25, "rgba(200,205,230,.10)");
		gr.addColorStop(1, "rgba(200,205,230,0)");
		g.fillStyle = gr; g.fillRect(0, 0, W, hz);
		g.fillStyle = "#fbf3dc";
		g.beginPath(); g.arc(moon.x, moon.y, moon.r, 0, TAU); g.fill();
		g.fillStyle = "rgba(190,180,160,.25)";
		g.beginPath(); g.arc(moon.x - moon.r * 0.3, moon.y - moon.r * 0.15, moon.r * 0.28, 0, TAU); g.fill();
		g.beginPath(); g.arc(moon.x + moon.r * 0.32, moon.y + moon.r * 0.3, moon.r * 0.18, 0, TAU); g.fill();
		// 水面の地色
		gr = g.createLinearGradient(0, hz, 0, H);
		gr.addColorStop(0, "#2c3653");
		gr.addColorStop(0.18, "#162038");
		gr.addColorStop(1, "#04070f");
		g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
		// 遠くの山並みと、水に映る影
		const ridge = (x, k) => (Math.sin(x * 0.006 + k) * 0.5 + Math.sin(x * 0.017 + k * 2.3) * 0.3 + Math.sin(x * 0.041 + k * 5) * 0.12 + 1) * 0.5;
		for (const [k, hgt, col] of [[1.7, 0.2, "#1b2440"], [4.2, 0.11, "#0a0f20"]]) {
			g.fillStyle = col;
			g.beginPath(); g.moveTo(0, hz + 1);
			for (let x = 0; x <= W; x += 4) g.lineTo(x, hz - ridge(x, k) * hz * hgt - 2);
			g.lineTo(W, hz + 1); g.closePath(); g.fill();
		}
		gr = g.createLinearGradient(0, hz, 0, hz + (H - hz) * 0.16);
		gr.addColorStop(0, "rgba(8,12,26,.85)");
		gr.addColorStop(1, "rgba(8,12,26,0)");
		g.fillStyle = gr; g.fillRect(0, hz, W, (H - hz) * 0.16);
		// 水平線の霞
		gr = g.createLinearGradient(0, hz - 14, 0, hz + 14);
		gr.addColorStop(0, "rgba(120,135,170,0)");
		gr.addColorStop(0.5, "rgba(120,135,170,.22)");
		gr.addColorStop(1, "rgba(120,135,170,0)");
		g.fillStyle = gr; g.fillRect(0, hz - 14, W, 28);
	}

	// ---- 波紋・雨粒の生成 ----
	// u: 奥行き（0 = 水平線, 1 = 手前）。遠いほど小さく、平たく見える
	function depthOf(y) { return Math.min(1, Math.max(0, (y - hz) / (H - hz))); }

	function addRipple(x, y, amp) {
		const u = depthOf(y);
		ripples.push({
			x, y, t: 0, amp,
			s: 0.2 + 0.8 * u, flat: 0.14 + 0.24 * u,
			life: (2.6 + Math.random() * 1.4) * (0.7 + 0.5 * u) * Math.sqrt(amp),
			rings: amp > 1.2 ? 4 : 3,
		});
		if (ripples.length > 500) ripples.shift();
		// 小さなしぶき
		const n = 3 + (Math.random() * 4 | 0);
		const s = 0.2 + 0.8 * u;
		for (let i = 0; i < n; i++) {
			sparks.push({
				x, y, y0: y, vx: (Math.random() - 0.5) * 70 * s * amp,
				vy: -(60 + Math.random() * 110) * s * amp, s, t: 0,
			});
		}
	}

	function spawnDrop() {
		const u = Math.pow(Math.random(), 1.5);	// 遠くほど数を多く（遠近感）
		const ty = hz + (H - hz) * (0.03 + 0.97 * u);
		const s = 0.2 + 0.8 * u;
		const fall = H * (0.5 + Math.random() * 0.5) * (0.4 + 0.6 * s);
		drops.push({ tx: Math.random() * (W + 80) - 40, ty, y: ty - fall, v: (700 + Math.random() * 350) * (0.35 + 0.65 * s), s });
	}

	// ---- 描画 ----
	function drawMoonPath(t) {
		// 月の光が水面に揺れる道
		const n = 46;
		for (let i = 0; i < n; i++) {
			const f = i / n;
			const y = hz + 3 + Math.pow(f, 1.35) * (H - hz) * 0.9;
			const w = moon.r * (0.7 + f * 4.2) * (0.55 + 0.45 * Math.sin(t * 1.2 + i * 1.9));
			const x = moon.x + Math.sin(t * 0.8 + i * 2.4) * moon.r * (0.2 + f * 1.4);
			ctx.fillStyle = `rgba(255,238,200,${0.26 * Math.pow(1 - f, 1.4)})`;
			ctx.beginPath();
			ctx.ellipse(x, y, Math.abs(w), 0.8 + f * 2.2, 0, 0, TAU);
			ctx.fill();
		}
	}

	function drawShimmer(t) {
		ctx.lineWidth = 1;
		for (const s of shimmer) {
			const a = 0.035 + 0.045 * Math.sin(t * s.sp + s.ph);
			if (a <= 0) continue;
			const y = hz + 4 + s.u * (H - hz);
			const x = (s.x + t * 6 * (0.3 + s.u)) % (W + 120) - 60;
			const len = s.len * (0.25 + s.u);
			ctx.strokeStyle = `rgba(170,190,230,${a})`;
			ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
		}
	}

	function drawRipples() {
		for (const r of ripples) {
			const fade = 1 - r.t / r.life;
			if (fade <= 0) continue;
			const lw = Math.max(0.6, 2.1 * r.s * (0.5 + 0.5 * fade));
			for (let k = 0; k < r.rings; k++) {
				const a = r.t - k * 0.24;
				if (a <= 0) continue;
				// はじめは速く、だんだんゆっくり広がる
				const rad = r.s * r.amp * (24 * a + 44 * (1 - Math.exp(-1.7 * a)));
				const al = Math.min(1, Math.pow(fade, 1.3) * (0.95 - k * 0.2) * (0.75 + 0.25 * r.amp));
				if (al < 0.012) continue;
				const ry = rad * r.flat;
				// 波の山（空を映す明るい線）と、その手前の谷（暗い線）
				ctx.lineWidth = lw;
				ctx.strokeStyle = `rgba(196,214,246,${al})`;
				ctx.beginPath(); ctx.ellipse(r.x, r.y, rad, ry, 0, 0, TAU); ctx.stroke();
				ctx.lineWidth = lw * 1.5;
				ctx.strokeStyle = `rgba(1,4,14,${al * 0.75})`;
				ctx.beginPath(); ctx.ellipse(r.x, r.y + lw * 1.3, rad * 0.985, ry * 0.985, 0, 0, TAU); ctx.stroke();
			}
		}
	}

	function drawDrops() {
		ctx.lineCap = "round";
		for (const d of drops) {
			const len = (10 + d.v * 0.022) * (0.5 + d.s);
			ctx.lineWidth = 0.6 + d.s * 0.9;
			ctx.strokeStyle = `rgba(190,206,236,${0.12 + 0.3 * d.s})`;
			ctx.beginPath();
			ctx.moveTo(d.tx + (d.ty - d.y) * 0.07, d.y);
			ctx.lineTo(d.tx + (d.ty - d.y + len) * 0.07, d.y - len);
			ctx.stroke();
		}
		for (const p of sparks) {
			ctx.fillStyle = `rgba(215,228,250,${0.75 * (1 - p.t / 0.6)})`;
			ctx.beginPath(); ctx.arc(p.x, p.y, 0.6 + p.s * 1.1, 0, TAU); ctx.fill();
		}
	}

	// ---- メインループ ----
	let last = performance.now();
	function frame(now) {
		requestAnimationFrame(frame);
		const dt = Math.min(0.05, (now - last) / 1000);
		last = now;
		const t = now / 1000;
		if (!W) { resize(); return; }

		// 雨粒の発生
		if (raining) {
			acc += rate * dt;
			while (acc >= 1) { acc -= 1; spawnDrop(); }
		}
		// 更新
		for (let i = drops.length - 1; i >= 0; i--) {
			const d = drops[i];
			d.y += d.v * dt;
			if (d.y >= d.ty) { addRipple(d.tx, d.ty, 0.55 + Math.random() * 0.7); drops.splice(i, 1); }
		}
		for (let i = ripples.length - 1; i >= 0; i--) {
			ripples[i].t += dt;
			if (ripples[i].t > ripples[i].life) ripples.splice(i, 1);
		}
		for (let i = sparks.length - 1; i >= 0; i--) {
			const p = sparks[i];
			p.t += dt; p.vy += 520 * p.s * dt;
			p.x += p.vx * dt; p.y += p.vy * dt * 0.6;
			if (p.t > 0.6 || p.y > p.y0 + 1) sparks.splice(i, 1);
		}

		// 描画
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.drawImage(bg, 0, 0);
		ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
		drawMoonPath(t);
		drawShimmer(t);
		drawRipples();
		drawDrops();
		// 周辺減光
		const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.35, W / 2, H * 0.55, Math.max(W, H) * 0.75);
		vg.addColorStop(0, "rgba(0,0,0,0)");
		vg.addColorStop(1, "rgba(0,0,6,.5)");
		ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
	}

	// ---- 操作 ----
	function showRate() {
		rateEl.textContent = raining ? (rate === 0 ? "なし" : "▮".repeat(Math.ceil(rate / 6)) + ` ${rate} 粒/秒`) : "（一時停止中）";
	}
	function setRate(v) { rate = Math.max(0, Math.min(60, Math.round(v))); showRate(); }

	let down = false, px = 0, py = 0;
	function poke(x, y, amp) { if (y > hz + 3) addRipple(x, y, amp); }
	cv.addEventListener("pointerdown", (e) => {
		window.focus();
		down = true; px = e.clientX; py = e.clientY;
		try { cv.setPointerCapture(e.pointerId); } catch (_) { /* 無視 */ }
		poke(px, py, 1.5);
	});
	cv.addEventListener("pointermove", (e) => {
		if (!down) return;
		// 一定距離動くごとに小さな波紋を置く
		if (Math.hypot(e.clientX - px, e.clientY - py) > 26) {
			px = e.clientX; py = e.clientY;
			poke(px, py, 0.9);
		}
	});
	window.addEventListener("pointerup", () => { down = false; });
	window.addEventListener("pointercancel", () => { down = false; });
	cv.addEventListener("wheel", (e) => { e.preventDefault(); setRate(rate - Math.sign(e.deltaY) * 2); }, { passive: false });
	window.addEventListener("keydown", (e) => {
		if (e.code === "Space") { e.preventDefault(); raining = !raining; showRate(); }
		else if (e.code === "ArrowUp" || e.code === "ArrowRight") { e.preventDefault(); setRate(rate + 2); }
		else if (e.code === "ArrowDown" || e.code === "ArrowLeft") { e.preventDefault(); setRate(rate - 2); }
	});

	window.addEventListener("resize", resize);
	if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
	resize();
	showRate();
	// 最初から少し波紋がある状態で始める
	for (let i = 0; i < 14; i++) {
		const u = Math.pow(Math.random(), 1.3);
		addRipple(Math.random() * W, hz + (H - hz) * (0.05 + 0.95 * u), 0.6 + Math.random() * 0.7);
		ripples[ripples.length - 1].t = Math.random() * 1.5;
	}
	sparks.length = 0;
	requestAnimationFrame(frame);
})();
</script>
</body>
</html>
