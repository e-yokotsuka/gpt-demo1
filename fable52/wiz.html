<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="ai.author" content="Claude Fable 5.2">
<meta name="ai.model" content="claude-fable-5-2">
<title>ランタン・デプス - Claude Fable 5.2版</title>
<style>
	html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; }
	canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
(() => {
	"use strict";
	// ===== 基本設定（論理解像度 960x600 を枠に合わせて拡縮） =====
	const W = 960, H = 600, MW = 41, MH = 29, T = 48, TAU = Math.PI * 2;
	const VX = 12, VY = 12, VW = 624, VH = 432; // ダンジョン表示域
	const cv = document.getElementById("c"), ctx = cv.getContext("2d");
	let vw = 960, vh = 600, dpr = 1, sc = 1, ox = 0, oy = 0;
	function resize() {
		// iframe がサイズ 0 で初期化されてもフォールバック値で動かす
		vw = window.innerWidth || 960;
		vh = window.innerHeight || 600;
		dpr = Math.min(window.devicePixelRatio || 1, 2);
		cv.width = Math.round(vw * dpr);
		cv.height = Math.round(vh * dpr);
		sc = Math.min(vw / W, vh / H);
		ox = (vw - W * sc) / 2;
		oy = (vh - H * sc) / 2;
	}
	addEventListener("resize", resize);
	resize();
	const rnd = (n) => Math.floor(Math.random() * n);
	const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };

	// ===== サウンド（ユーザー操作後に開始） =====
	let ac = null, master = null, nbuf = null, muted = false;
	function initAudio() {
		if (ac) { if (ac.state === "suspended") ac.resume(); return; }
		try {
			ac = new (window.AudioContext || window.webkitAudioContext)();
			master = ac.createGain();
			master.gain.value = 0.3;
			master.connect(ac.destination);
			nbuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
			const d = nbuf.getChannelData(0);
			for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
		} catch (e) { ac = null; }
	}
	function tone(f, d, type, v, f2, delay) {
		if (!ac || muted) return;
		const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
		o.type = type;
		o.frequency.setValueAtTime(f, t);
		if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
		g.gain.setValueAtTime(v, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + d);
		o.connect(g).connect(master);
		o.start(t);
		o.stop(t + d + 0.02);
	}
	function noise(d, v, fc) {
		if (!ac || muted) return;
		const t = ac.currentTime, s = ac.createBufferSource(), fl = ac.createBiquadFilter(), g = ac.createGain();
		s.buffer = nbuf;
		fl.type = "lowpass";
		fl.frequency.value = fc;
		g.gain.setValueAtTime(v, t);
		g.gain.exponentialRampToValueAtTime(0.0001, t + d);
		s.connect(fl).connect(g).connect(master);
		s.start(t, Math.random() * 0.5, d + 0.02);
	}
	const seq = (ns, type, v, gap) => ns.forEach((f, i) => tone(f, 0.16, type, v, 0, i * gap));
	const sfx = {
		step: () => noise(0.05, 0.12, 500),
		bump: () => tone(90, 0.08, "square", 0.1, 60),
		hit: () => { noise(0.12, 0.4, 2400); tone(200, 0.1, "square", 0.1, 80); },
		hurt: () => { noise(0.2, 0.4, 900); tone(140, 0.2, "sawtooth", 0.14, 50); },
		spell: () => { tone(400, 0.35, "sawtooth", 0.1, 1600); noise(0.35, 0.25, 5000); },
		heal: () => seq([523, 659, 784, 1047], "sine", 0.14, 0.07),
		chest: () => seq([659, 880, 1175], "square", 0.08, 0.08),
		stairs: () => seq([392, 330, 262, 196], "triangle", 0.16, 0.11),
		lvup: () => seq([523, 659, 784, 1047, 1319], "square", 0.08, 0.09),
		enc: () => seq([196, 185, 196, 185, 147], "sawtooth", 0.1, 0.07),
		win: () => seq([523, 523, 659, 784], "square", 0.08, 0.1),
		dead: () => seq([330, 294, 247, 196, 147], "triangle", 0.16, 0.2),
		end: () => seq([392, 523, 659, 784, 1047, 1319, 1568], "square", 0.08, 0.14),
	};

	// ===== データ =====
	// k=絵柄番号
	const MON = [
		{ n: "ぬめり茸", hp: 10, atk: 5, def: 0, exp: 4, g: 3, k: 0, c: "#7fd38a" },
		{ n: "宵羽こうもり", hp: 8, atk: 7, def: 0, exp: 5, g: 4, k: 1, c: "#9a7fd3" },
		{ n: "骨あさり", hp: 18, atk: 10, def: 1, exp: 9, g: 8, k: 2, c: "#d8d2c0" },
		{ n: "錆び甲冑", hp: 28, atk: 14, def: 4, exp: 14, g: 14, k: 3, c: "#c0794a" },
		{ n: "影舐め", hp: 26, atk: 18, def: 2, exp: 18, g: 16, k: 4, c: "#5a6ad0" },
		{ n: "石眼とかげ", hp: 42, atk: 22, def: 5, exp: 26, g: 24, k: 5, c: "#8fb0a0" },
	];
	const BOSS = { n: "灯喰らいの主", hp: 260, atk: 30, def: 8, exp: 0, g: 0, k: 6, c: "#ff7a3c" };
	const MIMIC = { n: "宝箱もどき", hp: 26, atk: 10, def: 3, exp: 20, g: 40, k: 7, c: "#b07a3a" };
	const WPN = ["古びた短剣", "鉄の小剣", "銀縁の剣", "星鋼の剣", "暁の刃"];
	const ARM = ["旅の外套", "革の胴着", "鎖かたびら", "鋼の胸当て", "月織りの鎧"];
	const LAST = 5;

	// ===== 状態 =====
	let state = "title", floor = 1, map, seen, vis, objs, rooms, encT = 10, time = 0;
	let lockT = 0, battle = null, trans = null, logs = [], hurtFx = 0, healFx = 0, steps = 0;
	const hero = {};
	const P = { x: 0, y: 0, ox: 0, oy: 0, mv: 0, dir: 2, bump: 0, bx: 0, by: 0 };
	const need = () => 8 * hero.lv * (hero.lv + 1);
	function log(s, c) { logs.push({ s, c: c || "#d8d2e6" }); if (logs.length > 30) logs.shift(); }

	function newGame() {
		Object.assign(hero, { lv: 1, hp: 30, mhp: 30, mp: 10, mmp: 10, atk: 6, def: 2, exp: 0, gold: 0, pot: 2, wpn: 0, arm: 0 });
		floor = 1; logs = []; battle = null; trans = null; steps = 0;
		gen();
		state = "explore";
		log("灯守りよ、五層の底で奪われた「暁の灯芯」を取り戻せ。", "#ffd28a");
	}

	// ===== ダンジョン自動生成（部屋＋L字通路） =====
	function gen() {
		map = new Uint8Array(MW * MH); seen = new Uint8Array(MW * MH); vis = new Uint8Array(MW * MH);
		objs = new Map(); rooms = [];
		for (let i = 0; i < 300 && rooms.length < 10; i++) {
			const w = 3 + rnd(5), h = 3 + rnd(4), x = 1 + rnd(MW - w - 2), y = 1 + rnd(MH - h - 2);
			if (rooms.some((r) => x < r.x + r.w + 1 && x + w + 1 > r.x && y < r.y + r.h + 1 && y + h + 1 > r.y)) continue;
			rooms.push({ x, y, w, h, cx: x + (w >> 1), cy: y + (h >> 1) });
			for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) map[yy * MW + xx] = 1;
		}
		const dig = (a, b) => {
			let x = a.cx, y = a.cy;
			const hx = () => { while (x !== b.cx) { map[y * MW + x] = 1; x += Math.sign(b.cx - x); } };
			const hy = () => { while (y !== b.cy) { map[y * MW + x] = 1; y += Math.sign(b.cy - y); } };
			if (Math.random() < 0.5) { hx(); hy(); } else { hy(); hx(); }
		};
		// 各部屋を既存の最寄りの部屋につなぎ、さらに環状路を少し足す
		for (let i = 1; i < rooms.length; i++) {
			let best = 0, bd = 1e9;
			for (let j = 0; j < i; j++) {
				const d = Math.abs(rooms[i].cx - rooms[j].cx) + Math.abs(rooms[i].cy - rooms[j].cy);
				if (d < bd) { bd = d; best = j; }
			}
			dig(rooms[i], rooms[best]);
		}
		for (let i = 0; i < 2; i++) { const a = rooms[rnd(rooms.length)], b = rooms[rnd(rooms.length)]; if (a !== b) dig(a, b); }
		// 開始地点と、そこから最も遠い部屋に階段（最下層は祭壇）
		P.x = P.ox = rooms[0].cx; P.y = P.oy = rooms[0].cy; P.mv = 0; P.dir = 2;
		const dist = new Int16Array(MW * MH).fill(-1), q = [P.y * MW + P.x];
		dist[q[0]] = 0;
		for (let i = 0; i < q.length; i++) {
			for (const d of [1, -1, MW, -MW]) { const n = q[i] + d; if (map[n] && dist[n] < 0) { dist[n] = dist[q[i]] + 1; q.push(n); } }
		}
		let far = rooms[1];
		for (const r of rooms) if (dist[r.cy * MW + r.cx] > dist[far.cy * MW + far.cx]) far = r;
		objs.set(far.cy * MW + far.cx, { t: floor < LAST ? "stairs" : "altar" });
		// 宝箱と泉
		const put = (t) => {
			for (let i = 0; i < 50; i++) {
				const r = rooms[1 + rnd(rooms.length - 1)], k = (r.y + rnd(r.h)) * MW + r.x + rnd(r.w);
				if (!objs.has(k)) { objs.set(k, { t, used: false }); return; }
			}
		};
		for (let i = 3 + rnd(2); i > 0; i--) put("chest");
		put("fount");
		encT = 10 + rnd(10);
		look();
	}

	// 視界計算: 見通せる床と、その周囲の壁を記録（オートマッピング）
	function los(x0, y0, x1, y1) {
		const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
		let e = dx - dy;
		while (x0 !== x1 || y0 !== y1) {
			const e2 = e * 2;
			if (e2 > -dy) { e -= dy; x0 += sx; }
			if (e2 < dx) { e += dx; y0 += sy; }
			if (!map[y0 * MW + x0]) return false;
		}
		return true;
	}
	function look() {
		vis.fill(0);
		const R = 6;
		for (let y = Math.max(1, P.y - R); y <= Math.min(MH - 2, P.y + R); y++) {
			for (let x = Math.max(1, P.x - R); x <= Math.min(MW - 2, P.x + R); x++) {
				if (!map[y * MW + x] || Math.hypot(x - P.x, y - P.y) > R + 0.5 || !los(P.x, P.y, x, y)) continue;
				for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
					const k = (y + j) * MW + x + i;
					if (i === 0 && j === 0 || !map[k]) vis[k] = seen[k] = 1;
				}
			}
		}
	}

	// ===== 探索 =====
	function tryMove(dx, dy) {
		if (state !== "explore" || P.mv > 0 || P.bump > 0 || trans) return;
		P.dir = dx ? (dx > 0 ? 1 : 3) : dy > 0 ? 2 : 0;
		const nx = P.x + dx, ny = P.y + dy;
		if (!map[ny * MW + nx]) { P.bump = 1; P.bx = dx; P.by = dy; sfx.bump(); return; }
		P.ox = P.x; P.oy = P.y; P.x = nx; P.y = ny; P.mv = 1;
		steps++;
		sfx.step();
		look();
	}
	function arrive() {
		const o = objs.get(P.y * MW + P.x);
		if (o) {
			if (o.t === "chest" && !o.used) openChest(o);
			else if (o.t === "fount" && !o.used) {
				o.used = true; hero.hp = hero.mhp; hero.mp = hero.mmp; healFx = 1;
				log("澄んだ泉の水を飲んだ。体力と魔力が満ちていく！", "#8fe0ff"); sfx.heal();
			} else if (o.t === "stairs") {
				sfx.stairs();
				trans = { t: 0, fn: () => { floor++; gen(); log(`地下 ${floor} 階へ降りた。${floor === LAST ? "奥から熱い気配がする…" : ""}`, "#ffd28a"); } };
			} else if (o.t === "altar" && !o.used) {
				log("灯芯を呑んだ影が、祭壇の上で身を起こした！", "#ff9a6a");
				startBattle([BOSS], true);
			}
			return;
		}
		if (--encT <= 0) {
			encT = 10 + rnd(10);
			const n = 1 + rnd(Math.min(3, 1 + (floor >> 1)) ), list = [];
			for (let i = 0; i < n; i++) list.push(MON[Math.max(0, Math.min(MON.length - 1, floor - 2 + rnd(3)))]);
			startBattle(list, false);
		}
	}
	function openChest(o) {
		o.used = true;
		const r = Math.random();
		if (floor > 1 && r < 0.08) { log("宝箱が牙をむいた！", "#ff9a6a"); startBattle([MIMIC], false); return; }
		sfx.chest();
		if (r < 0.32 && hero.wpn < WPN.length - 1) { hero.wpn++; hero.atk += 3; log(`宝箱から「${WPN[hero.wpn]}」を手に入れた！ 攻撃 +3`, "#ffe08a"); }
		else if (r < 0.56 && hero.arm < ARM.length - 1) { hero.arm++; hero.def += 2; log(`宝箱から「${ARM[hero.arm]}」を手に入れた！ 守り +2`, "#ffe08a"); }
		else if (r < 0.8) { hero.pot++; log("宝箱から 傷薬 を手に入れた。", "#ffe08a"); }
		else { const g = 15 + rnd(20) * floor; hero.gold += g; log(`宝箱から 金貨 ${g} 枚を手に入れた。`, "#ffe08a"); }
	}
	// 探索中の回復（薬 / 手当て）
	function usePotion() {
		if (!hero.pot) { log("傷薬がない。", "#f99"); return false; }
		hero.pot--; const h = Math.min(hero.mhp - hero.hp, 30); hero.hp += h; healFx = 1; sfx.heal();
		log(`傷薬を飲んだ。体力が ${h} 回復した。`, "#9f9"); return true;
	}
	function castHeal() {
		if (hero.mp < 4) { log("魔力が足りない。", "#f99"); return false; }
		hero.mp -= 4; const h = Math.min(hero.mhp - hero.hp, 14 + hero.lv * 4); hero.hp += h; healFx = 1; sfx.heal();
		log(`「手当て」を唱えた。体力が ${h} 回復した。`, "#9f9"); return true;
	}

	// ===== 戦闘（ターン制） =====
	const CMDS = () => ["たたかう", hero.lv >= 4 ? "連ね火 (3)" : "火花 (3)", "手当て (4)", `傷薬 ×${hero.pot}`, "にげる"];
	function startBattle(list, boss) {
		battle = { ens: list.map((m) => Object.assign({}, m, { mhp: m.hp, shake: 0, dead: false, fade: 1 })), sel: 0, cmd: 0, phase: "run", q: [], timer: 650, boss, turn: 0, intro: 1 };
		state = "battle";
		const names = [...new Set(list.map((m) => m.n))].join("と");
		log(`${names}があらわれた！`, "#ff9a6a");
		sfx.enc();
	}
	const dmg = (atk, def) => Math.max(1, Math.round(atk * (0.8 + Math.random() * 0.5) - def * 0.6));
	function strike(tg, d, msg) {
		if (tg.dead) return;
		tg.hp -= d; tg.shake = 1;
		log(`${msg}${tg.n}に ${d} のダメージ！`);
		if (tg.hp <= 0) { tg.hp = 0; tg.dead = true; log(`${tg.n}をたおした！`, "#ffe08a"); }
	}
	function checkWin() {
		const b = battle;
		if (!b.ens.every((e) => e.dead)) return;
		b.q = [() => {
			const ex = b.ens.reduce((s, e) => s + e.exp, 0), g = b.ens.reduce((s, e) => s + e.g, 0);
			hero.exp += ex; hero.gold += g;
			log(b.boss ? "灯喰らいの主は灰となって崩れ落ちた…" : `戦いに勝った！ 経験 ${ex}・金貨 ${g} を得た。`, "#ffd28a");
			sfx.win();
			while (hero.exp >= need()) {
				hero.lv++; hero.mhp += 7; hero.mmp += 3; hero.atk += 2; hero.def += 1;
				hero.hp = Math.min(hero.mhp, hero.hp + 10); hero.mp = Math.min(hero.mmp, hero.mp + 3);
				log(`レベルが ${hero.lv} に上がった！${hero.lv === 4 ? " 火花が「連ね火」に育った！" : ""}`, "#9fe8ff");
				sfx.lvup();
			}
		}, () => {
			const boss = b.boss;
			battle = null;
			if (boss) { state = "win"; lockT = time + 900; sfx.end(); } else state = "explore";
			return false;
		}];
	}
	function enemyAct(e) {
		const b = battle;
		if (e.dead || hero.hp <= 0) return false;
		if (!b.boss && Math.random() < 0.12) { log(`${e.n}は様子をうかがっている。`, "#aaa"); return; }
		const big = b.boss && b.turn % 3 === 2;
		const d = Math.round(dmg(e.atk, hero.def) * (big ? 1.6 : 1));
		hero.hp -= d; hurtFx = 1; sfx.hurt();
		log(`${e.n}の${big ? "大火の息" : "攻撃"}！ ${d} のダメージを受けた。`, "#ff9aa8");
		if (hero.hp <= 0) {
			hero.hp = 0;
			b.q = [() => { log("灯守りは力尽き、灯りが消えた…", "#f66"); sfx.dead(); }, () => { battle = null; state = "dead"; lockT = time + 900; return false; }];
		}
	}
	function act(c) {
		const b = battle;
		if (!b || b.phase !== "cmd") return;
		const tg = b.ens[b.sel], q = [];
		if (c === 0) q.push(() => { sfx.hit(); strike(tg, dmg(hero.atk, tg.def), "灯守りの攻撃！ "); checkWin(); });
		else if (c === 1) {
			if (hero.mp < 3) { log("魔力が足りない。", "#f99"); sfx.bump(); return; }
			q.push(() => {
				hero.mp -= 3; sfx.spell();
				const all = hero.lv >= 4, base = 8 + hero.lv * 3;
				for (const e of all ? b.ens : [tg]) { strike(e, base + rnd(5), all ? "連ね火！ " : "火花が弾ける！ "); if (!e.dead) e.burn = 1; }
				checkWin();
			});
		} else if (c === 2) { if (hero.mp < 4) { log("魔力が足りない。", "#f99"); sfx.bump(); return; } q.push(castHeal); }
		else if (c === 3) { if (!hero.pot) { log("傷薬がない。", "#f99"); sfx.bump(); return; } q.push(usePotion); }
		else q.push(() => {
			if (b.boss) log("主の炎が退路をふさいでいる！", "#f99");
			else if (Math.random() < 0.65) { log("うまく逃げ切った。"); b.q = [() => { battle = null; state = "explore"; return false; }]; }
			else log("逃げられなかった！", "#f99");
		});
		for (const e of b.ens) q.push(() => enemyAct(e));
		q.push(() => { b.turn++; return false; });
		b.q = q; b.phase = "run"; b.timer = 0; b.cmd = c;
	}
	function selMove(d) {
		const b = battle;
		for (let i = 0; i < b.ens.length; i++) { b.sel = (b.sel + d + b.ens.length) % b.ens.length; if (!b.ens[b.sel].dead) return; }
	}

	// ===== 更新 =====
	function update(dt) {
		time += dt;
		if (hurtFx > 0) hurtFx -= dt / 350;
		if (healFx > 0) healFx -= dt / 500;
		if (trans) {
			const p = trans.t;
			trans.t += dt / 320;
			if (p < 1 && trans.t >= 1) trans.fn();
			if (trans.t >= 2) trans = null;
		}
		if (state === "explore") {
			if (P.mv > 0) { P.mv -= dt / 115; if (P.mv <= 0) { P.mv = 0; arrive(); } }
			if (P.bump > 0) P.bump -= dt / 150;
			const d = heldDir();
			if (d) tryMove(d[0], d[1]);
		} else if (state === "battle") {
			const b = battle;
			if (b.intro > 0) b.intro -= dt / 400;
			for (const e of b.ens) {
				if (e.shake > 0) e.shake -= dt / 300;
				if (e.dead && e.fade > 0) e.fade -= dt / 400;
			}
			if (b.phase === "run") {
				b.timer -= dt;
				while (battle === b && b.phase === "run" && b.timer <= 0) {
					const f = b.q.shift();
					if (!f) { b.phase = "cmd"; if (b.ens[b.sel].dead) selMove(1); break; }
					if (f() !== false) b.timer = 520;
				}
			}
		}
	}

	// ===== 入力 =====
	const keys = {};
	let ptrDir = null;
	function heldDir() {
		if (keys.ArrowUp || keys.KeyW) return [0, -1];
		if (keys.ArrowDown || keys.KeyS) return [0, 1];

				text(String(i + 1), MENU.x + MENU.w - 14, y + 17, 11, "#6a6278", "right");
			});
			if (n > 1) text("← → で相手を選ぶ", MENU.x + MENU.w + 12, MENU.y + MENU.h - 8, 12, "#8a8298");
		}
		ctx.restore();
	}

	// ===== 右パネル・ログ =====
	function drawPanel() {
		const X = 648;
		box(X, 12, 300, 48);
		text("地下 " + floor + " 階", X + 16, 44, 22, "#ffd28a", "left", SERIF);
		text("ランタン・デプス", X + 284, 34, 13, "#9a8a78", "right", SERIF);
		text("歩数 " + steps, X + 284, 51, 11, "#6a6278", "right");
		box(X, 68, 300, 172);
		text("灯守り", X + 16, 96, 18, "#fff", "left", SERIF);
		text("Lv " + hero.lv, X + 284, 96, 16, "#9fe8ff", "right");
		text("体力", X + 16, 121, 13, "#cfc8dc"); bar(X + 56, 111, 150, hero.hp, hero.mhp, hero.hp < hero.mhp * 0.3 ? "#e0504a" : "#5ac06a");
		text(hero.hp + "/" + hero.mhp, X + 284, 121, 13, "#fff", "right");
		text("魔力", X + 16, 143, 13, "#cfc8dc"); bar(X + 56, 133, 150, hero.mp, hero.mmp, "#5a8ae0");
		text(hero.mp + "/" + hero.mmp, X + 284, 143, 13, "#fff", "right");
		text(`攻撃 ${hero.atk}　守り ${hero.def}`, X + 16, 168, 13, "#cfc8dc");
		text(`経験 ${hero.exp}/${need()}`, X + 284, 168, 13, "#cfc8dc", "right");
		text(`${WPN[hero.wpn]} ／ ${ARM[hero.arm]}`, X + 16, 192, 13, "#e8d8b8", "left", SERIF);
		text(`金貨 ${hero.gold}　　傷薬 ${hero.pot}`, X + 16, 222, 13, "#ffe08a");
		// オートマップ
		box(X, 248, 300, 226);
		text("オートマップ", X + 16, 268, 12, "#9a8a78", "left", SERIF);
		const mx = X + 7, my = 274, s = 7;
		for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
			const k = y * MW + x;
			if (!seen[k] || !map[k]) continue;
			const o = objs.get(k);
			ctx.fillStyle = o ? (o.t === "chest" ? (o.used ? "#6a5030" : "#f0c040") : o.t === "fount" ? (o.used ? "#557" : "#4fb8ff") : o.t === "stairs" ? "#fff" : "#ff7a3c") : vis[k] ? "#8a7fa0" : "#4a4458";
			ctx.fillRect(mx + x * s, my + y * s, s - 1, s - 1);
		}
		if ((time >> 8) & 1) { ctx.fillStyle = "#ff5a5a"; ctx.fillRect(mx + P.x * s - 1, my + P.y * s - 1, s + 1, s + 1); }
		// 操作説明とクレジット
		box(X, 482, 300, 106);
		const hl = state === "battle"
			? ["↑↓: コマンド　←→: 相手を選ぶ", "Enter / Space: 決定・送り", "1〜5: コマンドを直接選択", "タップでも操作できます"]
			: ["矢印 / WASD: 一歩ずつ移動", "Q: 傷薬　H: 手当て(魔力4)　M: 消音", "□宝箱  ■階段  ●泉 … 踏むと作動", "画面タップ: その方向へ進む"];
		hl.forEach((l, i) => text(l, X + 14, 503 + i * 18, 12, "#a8a0b8"));
		text("Claude Fable 5.2", X + 288, 580, 10, "#7a7288", "right");
		// メッセージログ
		box(12, 456, 624, 132);
		const ls = logs.slice(-5);
		ls.forEach((l, i) => { ctx.globalAlpha = i === ls.length - 1 ? 1 : 0.45 + i * 0.1; text(l.s, 28, 482 + i * 23, 15, l.c, "left", SERIF); });
		ctx.globalAlpha = 1;
	}
	function overlay(title, col, lines) {
		ctx.fillStyle = "rgba(5,4,10,.8)"; ctx.fillRect(0, 0, W, H);
		ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 30;
		text(title, W / 2, 230, 62, col, "center", SERIF);
		ctx.restore();
		lines.forEach((l, i) => text(l, W / 2, 290 + i * 30, 17, "#d8d2e6", "center", SERIF));
		if (time > lockT && (time >> 9) & 1) text("Enter / クリック / タップ で" + (state === "title" ? "はじめる" : "もう一度"), W / 2, 440, 18, "#fff", "center");
	}
	function draw() {
		ctx.setTransform(1, 0, 0, 1, 0, 0);
		ctx.fillStyle = "#07060b";
		ctx.fillRect(0, 0, cv.width, cv.height);
		ctx.setTransform(sc * dpr, 0, 0, sc * dpr, ox * dpr, oy * dpr);
		if (state === "title") {
			// タイトル: 闇に揺れる灯り
			overlay("ランタン・デプス", "#ffb45a", ["〜 灯守りと五層の闇 〜", "", "", "", "自動生成される迷宮を一歩ずつ進み、地下五階の「暁の灯芯」を取り戻せ"]);
			const fk = 0.9 + 0.1 * Math.sin(time * 0.013) * Math.sin(time * 0.005);
			ctx.globalCompositeOperation = "lighter"; glow(W / 2, 330, 330 * fk, "rgba(255,150,60,.28)"); glow(W / 2, 372, 60 * fk, "rgba(255,220,140,.9)"); ctx.globalCompositeOperation = "source-over";
			ctx.fillStyle = "#3a3030"; ctx.fillRect(W / 2 - 14, 346, 28, 46); ctx.fillRect(W / 2 - 20, 340, 40, 7); ctx.fillRect(W / 2 - 20, 390, 40, 7);
			circ(W / 2, 370, 10 * fk, "#fff0b0");
			text("LANTERN DEPTHS", W / 2, 160, 16, "#9a8a78", "center", SERIF);
			text("Claude Fable 5.2", W - 12, H - 10, 11, "#7a7288", "right");
			return;
		}
		ctx.fillStyle = "#0b0a10"; ctx.fillRect(0, 0, W, H);
		if (state === "battle") drawBattle(); else drawView();
		// 表示域の枠と被弾・回復の光
		if (hurtFx > 0) { ctx.fillStyle = `rgba(255,40,40,${hurtFx * 0.35})`; ctx.fillRect(VX, VY, VW, VH); }
		if (healFx > 0) { ctx.fillStyle = `rgba(120,255,160,${healFx * 0.22})`; ctx.fillRect(VX, VY, VW, VH); }
		ctx.strokeStyle = "#5a4a38"; ctx.lineWidth = 2; ctx.strokeRect(VX - 1, VY - 1, VW + 2, VH + 2);
		drawPanel();
		if (trans) { ctx.fillStyle = `rgba(0,0,0,${trans.t < 1 ? trans.t : 2 - trans.t})`; ctx.fillRect(VX, VY, VW, VH); }
		if (state === "dead") overlay("灯りは消えた", "#e0504a", [`地下 ${floor} 階で力尽きた。`, `レベル ${hero.lv}　金貨 ${hero.gold}　歩数 ${steps}`]);
		if (state === "win") overlay("暁の灯芯、奪還", "#ffd28a", ["灯喰らいの主は倒れ、迷宮に朝の光が差した。", `レベル ${hero.lv}　金貨 ${hero.gold}　歩数 ${steps}`]);
	}

	// ===== メインループ =====
	let last = 0;
	function loop(t) {
		requestAnimationFrame(loop);
		// 画面サイズ 0 で初期化された場合の復帰
		if ((window.innerWidth || 960) !== vw || (window.innerHeight || 600) !== vh) resize();
		const dt = Math.min(50, t - last);
		last = t;
		update(dt);
		draw();
	}
	requestAnimationFrame(loop);

	// 動作確認用フック
	window.__dbg = {
		get s() {
			return {
				state, floor, steps, x: P.x, y: P.y, mv: P.mv, encT, hero: Object.assign({}, hero), trans: !!trans,
				battle: battle ? { phase: battle.phase, boss: battle.boss, ens: battle.ens.map((e) => ({ n: e.n, hp: e.hp, dead: e.dead })) } : null,
				seen: seen ? seen.reduce((a, b) => a + b, 0) : 0, log: logs.slice(-3).map((l) => l.s),
			};
		},
		get map() { return { w: MW, h: MH, cells: Array.from(map), objs: [...objs].map(([k, o]) => ({ k, t: o.t, used: !!o.used })) }; },
		hero,
		set enc(v) { encT = v; },
		set floor(v) { floor = v; gen(); },
	};
})();
</script>
