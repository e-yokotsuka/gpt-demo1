<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="ai.author" content="Claude Fable 5.2">
	<meta name="ai.model" content="claude-fable-5-2">
	<title>Megademo Style Demo - Claude Fable 5.2版</title>
	<style>
		html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
		body { display: flex; align-items: center; justify-content: center; }
		canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
		.hud { position: fixed; color: #8f8; font: 11px/1.5 "Consolas", "Menlo", monospace; letter-spacing: .06em; pointer-events: none; text-shadow: 1px 1px 0 #000; opacity: .7; }
		#help { left: 12px; top: 8px; }
		#credit { right: 12px; top: 8px; }
	</style>
</head>
<body>
	<canvas id="c" width="480" height="270"></canvas>
	<div class="hud" id="help">クリック: 音楽 ON/OFF ／ Space・→: 次のパート</div>
	<div class="hud" id="credit">Claude Fable 5.2</div>
	<script>
		// ===== 90年代メガデモ風デモ（ライブラリなし。480x270 の低解像度バッファを拡大表示） =====
		const W = 480, H = 270;
		const cv = document.getElementById("c");
		const ctx = cv.getContext("2d");
		const img = ctx.createImageData(W, H);
		const px = new Uint32Array(img.data.buffer); // ABGR（リトルエンディアン）で直接書き込む
		const rgb = (r, g, b) => (255 << 24) | (b << 16) | (g << 8) | r;

		// 表示サイズをウィンドウに合わせる（16:9 を保つ）
		function fit() {
			const w = window.innerWidth || 960, h = window.innerHeight || 600;
			const s = Math.min(w / W, h / H);
			cv.style.width = Math.floor(W * s) + "px";
			cv.style.height = Math.floor(H * s) + "px";
		}
		window.addEventListener("resize", fit);
		if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
		fit();

		// ---- 事前計算テーブル ----
		const SIN = new Float32Array(1024);
		for (let i = 0; i < 1024; i++) SIN[i] = Math.sin((i / 1024) * Math.PI * 2);
		const sin = (v) => SIN[(v * 162.97) & 1023]; // ラジアン → テーブル引き

		// プラズマ用パレット（256色）
		const plasmaPal = new Uint32Array(256);
		for (let i = 0; i < 256; i++) {
			const a = (i / 256) * Math.PI * 2;
			plasmaPal[i] = rgb(128 + 127 * Math.sin(a), 128 + 127 * Math.sin(a * 2 + 2), 128 + 127 * Math.sin(a + 4));
		}

		// 256x256 のテクスチャ（XOR 模様 + 格子）。トンネルとロトズーマーで使う
		const tex = new Uint32Array(65536);
		for (let y = 0; y < 256; y++) {
			for (let x = 0; x < 256; x++) {
				const v = (x ^ y) & 255;
				const grid = (x & 31) < 2 || (y & 31) < 2 ? 90 : 0;
				const chk = ((x >> 5) ^ (y >> 5)) & 1;
				tex[(y << 8) | x] = rgb(
					Math.min(255, (chk ? v : v >> 2) + grid),
					Math.min(255, (v >> 1) + grid + (chk ? 0 : 40)),
					Math.min(255, (chk ? 255 - v : 120 + (v >> 1)) + grid)
				);
			}
		}

		// トンネル用の距離・角度テーブル
		const tunD = new Uint8Array(W * H), tunA = new Uint8Array(W * H), tunS = new Uint8Array(W * H);
		for (let y = 0; y < H; y++) {
			for (let x = 0; x < W; x++) {
				const dx = x - W / 2, dy = y - H / 2;
				const d = Math.sqrt(dx * dx + dy * dy) || 1;
				const i = y * W + x;
				tunD[i] = (9000 / d) & 255;
				tunA[i] = ((Math.atan2(dy, dx) / Math.PI) * 256) & 255;
				tunS[i] = Math.min(255, d * 2.2); // 奥ほど暗く
			}
		}

		// 星
		const stars = [];
		for (let i = 0; i < 260; i++) stars.push({ x: Math.random() * 2 - 1, y: Math.random() * 2 - 1, z: Math.random() });

		// ---- 文字（オフスクリーンに描いておき、縦スライスで貼る） ----
		const SCROLL = "     HELLO WORLD!  THIS IS A TRIBUTE TO THE GOLDEN AGE OF THE DEMOSCENE ... " +
			"PLASMA * COPPER BARS * STARFIELD * VECTORS * TUNNEL * ROTOZOOMER ... ALL IN ONE HTML FILE, NO LIBRARIES ... " +
			"CODE AND PIXELS BY CLAUDE FABLE 5.2 ... GREETINGS FLY OUT TO EVERYONE WHO EVER TYPED A SINE TABLE BY HAND ... " +
			"PRESS SPACE TO SKIP PARTS ... CLICK FOR CHIP MUSIC ... SCROLLER RESTARTS NOW ...     ";
		const FONT = 'bold 30px "Courier New", monospace';
		function textCanvas(text, font, h, stops) {
			const c = document.createElement("canvas");
			let g = c.getContext("2d");
			g.font = font;
			c.width = Math.ceil(g.measureText(text).width) + 4;
			c.height = h;
			g = c.getContext("2d");
			g.font = font;
			g.textBaseline = "middle";
			g.fillStyle = "#000";
			g.fillText(text, 4, h / 2 + 3);
			const gr = g.createLinearGradient(0, h * 0.15, 0, h * 0.85);
			stops.forEach((s, i) => gr.addColorStop(i / (stops.length - 1), s));
			g.fillStyle = gr;
			g.fillText(text, 2, h / 2);
			return c;
		}
		const scrollCv = textCanvas(SCROLL, FONT, 40, ["#fff", "#ff8", "#f80", "#f0a", "#80f"]);
		const logoCv = textCanvas("FABLE 5.2", 'bold 64px "Arial Black", Impact, sans-serif', 80, ["#fff", "#8ff", "#08f", "#00a", "#f0f"]);

		// ---- 各エフェクト ----
		function clear(color) { px.fill(color); }

		function drawStars(t, dt) {
			for (const s of stars) {
				s.z -= dt * 0.35;
				if (s.z <= 0.02) { s.x = Math.random() * 2 - 1; s.y = Math.random() * 2 - 1; s.z = 1; }
				const x = (W / 2 + (s.x / s.z) * 200) | 0, y = (H / 2 + (s.y / s.z) * 200) | 0;
				if (x < 0 || x >= W - 1 || y < 0 || y >= H - 1) continue;
				const c = (255 * (1 - s.z)) | 0;
				px[y * W + x] = rgb(c, c, c);
				if (s.z < 0.3) px[y * W + x + 1] = px[(y + 1) * W + x] = rgb(c, c, c);
			}
		}

		// ラスターバー（コッパーバー）。奥のものから順に重ねる
		const BAR_COL = [[255, 60, 60], [255, 160, 40], [255, 240, 60], [60, 255, 90], [60, 220, 255], [90, 90, 255], [220, 80, 255]];
		function drawBars(t, cy, amp) {
			const order = BAR_COL.map((c, i) => ({ c, ph: t * 2.2 + i * 0.5 })).sort((a, b) => Math.cos(a.ph) - Math.cos(b.ph));
			for (const b of order) {
				const y0 = Math.round(cy + Math.sin(b.ph) * amp);
				for (let k = -7; k <= 7; k++) {
					const y = y0 + k;
					if (y < 0 || y >= H) continue;
					const l = 1 - Math.abs(k) / 8;
					px.fill(rgb(b.c[0] * l, b.c[1] * l, b.c[2] * l), y * W, y * W + W);
				}
			}
		}

		function plasma(t) {
			const t1 = t * 1.3, t2 = t * 0.9, t3 = t * 1.7;
			const shift = (t * 40) | 0;
			for (let y = 0; y < H; y++) {
				const sy = sin(y * 0.031 + t2) + sin(y * 0.017 - t1);
				const row = y * W;
				for (let x = 0; x < W; x++) {
					const dx = x - W / 2 + 90 * SIN[(t * 60) & 1023], dy = y - H / 2;
					const v = sy + sin(x * 0.023 + t1) + sin((x + y) * 0.014 + t3) + sin(Math.sqrt(dx * dx + dy * dy) * 0.045 - t3);
					px[row + x] = plasmaPal[((v * 32 + shift) | 0) & 255];
				}
			}
		}

		function tunnel(t) {
			const du = (t * 90) | 0, dv = (t * 30 + Math.sin(t) * 40) | 0;
			for (let i = 0; i < W * H; i++) {
				const c = tex[(((tunD[i] + du) & 255) << 8) | ((tunA[i] + dv) & 255)];
				const s = tunS[i];
				px[i] = (255 << 24) | ((((c >> 16) & 255) * s >> 8) << 16) | ((((c >> 8) & 255) * s >> 8) << 8) | ((c & 255) * s >> 8);
			}
		}

		function rotozoom(t) {
			const a = t * 0.7, z = 1.1 + Math.sin(t * 1.1) * 0.8;
			const ca = Math.cos(a) * z * 256, sa = Math.sin(a) * z * 256;
			const ox = Math.sin(t * 0.5) * 30000, oy = t * 9000;
			for (let y = 0; y < H; y++) {
				let u = ox - (W / 2) * ca - (y - H / 2) * sa;
				let v = oy - (W / 2) * sa + (y - H / 2) * ca;
				const row = y * W;
				for (let x = 0; x < W; x++) {
					px[row + x] = tex[(((v >> 8) & 255) << 8) | ((u >> 8) & 255)];
					u += ca; v += sa;
				}
			}
		}

		// 塗りつぶしベクター（二十面体。Canvas のパスで描く）
		const PHI = (1 + Math.sqrt(5)) / 2;
		const ICO_V = [[-1, PHI, 0], [1, PHI, 0], [-1, -PHI, 0], [1, -PHI, 0], [0, -1, PHI], [0, 1, PHI], [0, -1, -PHI], [0, 1, -PHI], [PHI, 0, -1], [PHI, 0, 1], [-PHI, 0, -1], [-PHI, 0, 1]];
		const ICO_F = [[0, 11, 5], [0, 5, 1], [0, 1, 7], [0, 7, 10], [0, 10, 11], [1, 5, 9], [5, 11, 4], [11, 10, 2], [10, 7, 6], [7, 1, 8], [3, 9, 4], [3, 4, 2], [3, 2, 6], [3, 6, 8], [3, 8, 9], [4, 9, 5], [2, 4, 11], [6, 2, 10], [8, 6, 7], [9, 8, 1]];
		function vectorObject(t) {
			const ax = t * 0.9, ay = t * 1.3, az = t * 0.5;
			const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay), cz = Math.cos(az), sz = Math.sin(az);
			const size = 46 + Math.sin(t * 2) * 8;
			const pts = ICO_V.map(([x, y, z]) => {
				let t1 = y * cx - z * sx; z = y * sx + z * cx; y = t1;
				t1 = x * cy + z * sy; z = -x * sy + z * cy; x = t1;
				t1 = x * cz - y * sz; y = x * sz + y * cz; x = t1;
				const p = 5 / (5 + z);
				return [W / 2 + Math.sin(t * 0.8) * 90 + x * size * p, H / 2 - 20 + Math.cos(t * 1.1) * 26 + y * size * p, z];
			});
			ctx.lineJoin = "round";
			for (const f of ICO_F) {
				const [a, b, c] = [pts[f[0]], pts[f[1]], pts[f[2]]];
				// 外積の z 成分で裏面を除去し、同じ値を明るさにも使う
				const n = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
				if (n >= 0) continue;
				const l = Math.pow(Math.min(1, -n / (size * size * 4.2)), 1.6);
				ctx.fillStyle = `rgb(${40 + l * 215 | 0},${20 + l * 120 | 0},${90 + l * 165 | 0})`;
				ctx.strokeStyle = "#fff";
				ctx.lineWidth = 1;
				ctx.beginPath();
				ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]);
				ctx.closePath();
				ctx.fill();
				ctx.stroke();
			}
		}

		// 走査線ごとに横へ揺らすロゴ
		function wobbleLogo(t, y0) {
			const lw = logoCv.width, lh = logoCv.height;
			for (let y = 0; y < lh; y++) {
				const off = Math.sin(t * 3 + y * 0.09) * 14 + Math.sin(t * 1.7 + y * 0.04) * 10;
				ctx.drawImage(logoCv, 0, y, lw, 1, ((W - lw) / 2 + off) | 0, y0 + y, lw, 1);
			}
		}

		// サインスクローラー
		let scrollX = 0;
		function scroller(t, dt, base, amp) {
			scrollX = (scrollX + dt * 130) % scrollCv.width;
			const tw = scrollCv.width;
			for (let x = 0; x < W; x += 2) {
				const sx = (x + scrollX) % tw;
				const y = base + Math.sin(x * 0.022 + t * 3.2) * amp + Math.sin(x * 0.05 - t * 2) * amp * 0.3;
				ctx.drawImage(scrollCv, sx | 0, 0, 2, 40, x, y | 0, 2, 40);
			}
		}

		// ---- パート構成 ----
		// pixel: ピクセルバッファへ描く処理 / over: その上に Canvas API で重ねる処理
		const PARTS = [
			{ name: "COPPER BARS + STARFIELD", pixel(t, dt) { clear(rgb(0, 0, 16)); drawBars(t, 86, 62); drawStars(t, dt); }, over(t) { wobbleLogo(t, 46); } },
			{ name: "PLASMA", pixel(t) { plasma(t); }, over() {} },
			{ name: "FILLED VECTORS", pixel(t, dt) { clear(rgb(8, 0, 24)); drawBars(t * 0.6, 215, 30); drawStars(t, dt); }, over(t) { vectorObject(t); } },
			{ name: "TUNNEL", pixel(t) { tunnel(t); }, over() {} },
			{ name: "ROTOZOOMER", pixel(t) { rotozoom(t); }, over() {} },
		];
		const PART_SEC = 12;
		let part = 0, partT = 0;
		function nextPart() { part = (part + 1) % PARTS.length; partT = 0; }

		// ---- チップチューン風 BGM（クリックで開始。矩形波アルペジオ + ベース + ノイズ） ----
		let ac = null, master = null, playing = false, step = 0, nextTime = 0, noiseBuf = null;
		const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]]; // Am F C G
		const LEAD = [76, 0, 72, 76, 79, 0, 76, 72, 77, 0, 72, 77, 81, 0, 77, 72, 79, 0, 76, 72, 67, 0, 72, 76, 74, 0, 71, 74, 79, 0, 74, 71];
		const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
		function blip(type, freq, t, dur, vol) {
			const o = ac.createOscillator(), g = ac.createGain();
			o.type = type;
			o.frequency.value = freq;
			g.gain.setValueAtTime(vol, t);
			g.gain.exponentialRampToValueAtTime(0.001, t + dur);
			o.connect(g).connect(master);
			o.start(t);
			o.stop(t + dur);
		}
		function hat(t, vol, dur) {
			const s = ac.createBufferSource(), g = ac.createGain();
			s.buffer = noiseBuf;
			g.gain.setValueAtTime(vol, t);
			g.gain.exponentialRampToValueAtTime(0.001, t + dur);
			s.connect(g).connect(master);
			s.start(t);
			s.stop(t + dur);
		}
		function schedule() {
			if (!playing) return;
			const S = 0.115; // 16分音符の長さ
			while (nextTime < ac.currentTime + 0.15) {
				const bar = (step >> 4) & 3, s = step & 15, ch = CHORDS[bar];
				blip("square", hz(ch[step % 3] + 12), nextTime, S * 0.9, 0.035);           // アルペジオ
				if (s % 4 === 0 || s === 6 || s === 14) blip("triangle", hz(ch[0] - 24), nextTime, S * 1.8, 0.22); // ベース
				const ld = LEAD[(bar * 8 + (s >> 1)) % LEAD.length];
				if (s % 2 === 0 && ld) blip("sawtooth", hz(ld), nextTime, S * 1.9, 0.045); // メロディ
				if (s % 8 === 4) hat(nextTime, 0.16, 0.12);                                // スネア風
				else if (s % 2 === 0) hat(nextTime, 0.04, 0.03);                           // ハイハット
				if (s % 8 === 0) {                                                         // キック
					const o = ac.createOscillator(), g = ac.createGain();
					o.frequency.setValueAtTime(150, nextTime);
					o.frequency.exponentialRampToValueAtTime(40, nextTime + 0.12);
					g.gain.setValueAtTime(0.35, nextTime);
					g.gain.exponentialRampToValueAtTime(0.001, nextTime + 0.15);
					o.connect(g).connect(master);
					o.start(nextTime);
					o.stop(nextTime + 0.16);
				}
				nextTime += S;
				step++;
			}
		}
		function toggleMusic() {
			if (!ac) {
				ac = new (window.AudioContext || window.webkitAudioContext)();
				master = ac.createGain();
				master.gain.value = 0.6;
				master.connect(ac.destination);
				noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.2, ac.sampleRate);
				const d = noiseBuf.getChannelData(0);
				for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
				setInterval(schedule, 40);
			}
			playing = !playing;
			if (playing) { ac.resume(); nextTime = ac.currentTime + 0.05; }
		}

		// ---- 入力 ----
		window.addEventListener("pointerdown", () => { window.focus(); toggleMusic(); });
		window.addEventListener("keydown", (e) => {
			if (e.code === "Space" || e.code === "ArrowRight") { e.preventDefault(); nextPart(); }
			else if (e.code === "ArrowLeft") { e.preventDefault(); part = (part + PARTS.length - 1) % PARTS.length; partT = 0; }
			else if (e.code === "ArrowUp" || e.code === "ArrowDown") e.preventDefault();
		});

		// ---- メインループ ----
		let last = performance.now(), time = 0;
		function frame(now) {
			requestAnimationFrame(frame);
			const dt = Math.min(0.05, (now - last) / 1000);
			last = now;
			time += dt;
			partT += dt;
			if (partT > PART_SEC) nextPart();

			const p = PARTS[part];
			p.pixel(time, dt);
			ctx.putImageData(img, 0, 0);
			p.over(time);

			// 画面下のスクローラー（下地を少し暗くして読みやすく）
			ctx.fillStyle = "rgba(0,0,0,.35)";
			ctx.fillRect(0, 178, W, 92);
			scroller(time, dt, 204, 22);

			// パート名
			ctx.font = "bold 9px monospace";
			ctx.textBaseline = "top";
			ctx.fillStyle = "#000";
			ctx.fillText(`PART ${part + 1}/${PARTS.length}  ${p.name}`, 7, 259);
			ctx.fillStyle = "#fff";
			ctx.fillText(`PART ${part + 1}/${PARTS.length}  ${p.name}`, 6, 258);

			// パート切替のフェード
			const fade = Math.max(1 - partT / 0.6, (partT - (PART_SEC - 0.6)) / 0.6);
			if (fade > 0) {
				ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`;
				ctx.fillRect(0, 0, W, H);
			}
			// 走査線（CRT 風）
			ctx.fillStyle = "rgba(0,0,0,.14)";
			for (let y = 1; y < H; y += 2) ctx.fillRect(0, y, W, 1);
		}
		requestAnimationFrame(frame);
	</script>
</body>
</html>
