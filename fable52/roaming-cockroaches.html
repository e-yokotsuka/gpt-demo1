<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="ai.author" content="Claude Fable 5.2">
	<meta name="ai.model" content="claude-fable-5-2">
	<title>Roaming Cockroaches - Claude Fable 5.2版</title>
	<style>
		html, body { margin: 0; height: 100%; background: #efe6d2; overflow: hidden; }
		canvas { display: block; width: 100%; height: 100%; touch-action: none; }
		.hud { position: fixed; font: 12px/1.6 "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; color: #5a4a36; pointer-events: none; background: #fff8e8cc; padding: 3px 10px; border-radius: 999px; }
		#help { left: 12px; bottom: 12px; }
		#credit { right: 12px; bottom: 12px; opacity: .7; }
	</style>
</head>
<body>
	<canvas id="c"></canvas>
	<div class="hud" id="help">マウスを近づけると逃げる ／ クリック: おどかす ／ ↑↓: 数を増減（<span id="count"></span>匹）</div>
	<div class="hud" id="credit">Claude Fable 5.2</div>
	<script>
		// ===== カサカサ歩き回るコミカルなゴキブリたち（画像なし・Canvas 2D） =====
		const cv = document.getElementById("c"), ctx = cv.getContext("2d");
		const countEl = document.getElementById("count");
		let W = 960, H = 600, DPR = 1;
		let floor = null; // 床タイル（オフスクリーンに描いておく）

		const rand = (a, b) => a + Math.random() * (b - a);
		// 角度差を -π〜π に正規化
		const wrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));

		function resize() {
			DPR = Math.min(window.devicePixelRatio || 1, 2);
			W = window.innerWidth || 960;
			H = window.innerHeight || 600;
			cv.width = Math.round(W * DPR);
			cv.height = Math.round(H * DPR);
			makeFloor();
		}

		// キッチンの床: 市松タイルとパンくず
		function makeFloor() {
			floor = document.createElement("canvas");
			floor.width = cv.width; floor.height = cv.height;
			const g = floor.getContext("2d");
			g.scale(DPR, DPR);
			const T = 96;
			for (let y = 0; y < H; y += T) {
				for (let x = 0; x < W; x += T) {
					g.fillStyle = ((x / T + y / T) & 1) ? "#f3ead6" : "#e9dfc8";
					g.fillRect(x, y, T, T);
				}
			}
			g.strokeStyle = "#d6c9ad";
			g.lineWidth = 2;
			g.beginPath();
			for (let x = 0; x <= W; x += T) { g.moveTo(x, 0); g.lineTo(x, H); }
			for (let y = 0; y <= H; y += T) { g.moveTo(0, y); g.lineTo(W, y); }
			g.stroke();
			for (let i = 0; i < 70; i++) {
				g.fillStyle = `rgba(${rand(150, 200) | 0},${rand(110, 150) | 0},70,${rand(0.25, 0.6)})`;
				g.beginPath();
				g.arc(rand(0, W), rand(0, H), rand(0.8, 2.6), 0, 7);
				g.fill();
			}
		}

		// ---- ゴキブリ ----
		const COLORS = [["#7a4a22", "#a8703a"], ["#5e3518", "#8a5528"], ["#8c5a2c", "#bb8448"], ["#4a2a14", "#754522"]];
		const roaches = [];
		function addRoach() {
			const col = COLORS[(Math.random() * COLORS.length) | 0];
			roaches.push({
				x: rand(40, W - 40), y: rand(40, H - 40),
				dir: rand(0, Math.PI * 2),   // 進行方向
				speed: 0,                    // 現在の速さ（px/秒）
				cruise: rand(60, 130),       // 普段の速さ
				size: rand(0.75, 1.3),
				gait: rand(0, 10),           // 脚の振りの位相
				turn: 0,                     // ふらつきの角速度
				pause: rand(0, 2),           // 立ち止まり残り時間
				fear: 0,                     // 恐怖度 0〜1
				ant: rand(0, 10),            // 触角の位相
				body: col[0], shell: col[1],
			});
		}
		function setCount(n) {
			n = Math.max(1, Math.min(80, n));
			while (roaches.length < n) addRoach();
			roaches.length = n;
			countEl.textContent = n;
		}

		// ---- 入力 ----
		const mouse = { x: -9999, y: -9999, on: false };
		const drops = [];  // 冷や汗
		const rings = [];  // おどかした時の衝撃波
		cv.addEventListener("pointermove", (e) => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; });
		cv.addEventListener("pointerleave", () => { mouse.on = false; });
		cv.addEventListener("pointerdown", (e) => {
			window.focus();
			mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = e.pointerType === "mouse";
			scare(e.clientX, e.clientY);
		});
		window.addEventListener("keydown", (e) => {
			if (e.code === "ArrowUp") { e.preventDefault(); setCount(roaches.length + 3); }
			else if (e.code === "ArrowDown") { e.preventDefault(); setCount(roaches.length - 3); }
			else if (e.code === "Space") { e.preventDefault(); scare(W / 2, H / 2); }
			else if (e.code === "ArrowLeft" || e.code === "ArrowRight") e.preventDefault();
		});
		// 全員を一斉に驚かせる
		function scare(x, y) {
			rings.push({ x, y, r: 10, life: 1 });
			for (const r of roaches) {
				const d = Math.hypot(r.x - x, r.y - y);
				if (d < 420) {
					r.fear = 1;
					r.pause = 0;
					r.dir = Math.atan2(r.y - y, r.x - x) + rand(-0.5, 0.5);
				}
			}
		}

		function update(r, dt) {
			// マウスが近いと恐怖度が上がり、反対方向へ向きを変える
			let flee = false;
			if (mouse.on) {
				const dx = r.x - mouse.x, dy = r.y - mouse.y, d = Math.hypot(dx, dy);
				if (d < 170) {
					flee = true;
					r.fear = Math.min(1, r.fear + dt * 6 * (1 - d / 170 + 0.3));
					r.pause = 0;
					r.dir += wrap(Math.atan2(dy, dx) - r.dir) * Math.min(1, dt * 12);
				}
			}
			if (!flee) r.fear = Math.max(0, r.fear - dt * 0.7);

			// ふだんの行動: ふらふら歩いて、ときどき立ち止まる
			if (r.pause > 0) {
				r.pause -= dt;
			} else if (r.fear < 0.1 && Math.random() < dt * 0.35) {
				r.pause = rand(0.3, 1.6);
				r.turn = 0;
			}
			if (r.pause <= 0) {
				r.turn += rand(-1, 1) * dt * 14;
				r.turn *= 1 - dt * 2;
				r.dir += r.turn * dt * (1 + r.fear);
			}
			// 壁に近づいたら内側へ向きを変える
			const m = 36;
			let ax = 0, ay = 0;
			if (r.x < m) ax = 1; else if (r.x > W - m) ax = -1;
			if (r.y < m) ay = 1; else if (r.y > H - m) ay = -1;
			if (ax || ay) r.dir += wrap(Math.atan2(ay, ax) - r.dir) * Math.min(1, dt * 7);

			const target = r.pause > 0 ? 0 : r.cruise + r.fear * 420;
			r.speed += (target - r.speed) * Math.min(1, dt * (r.fear > 0.3 ? 10 : 5));
			r.x += Math.cos(r.dir) * r.speed * dt;
			r.y += Math.sin(r.dir) * r.speed * dt;
			r.x = Math.max(8, Math.min(W - 8, r.x));
			r.y = Math.max(8, Math.min(H - 8, r.y));
			r.gait += r.speed * dt * 0.22 / r.size; // 歩幅に合わせて脚を動かす
			r.ant += dt * (3 + r.fear * 14);

			// 逃げている間は冷や汗を飛ばす
			if (r.fear > 0.5 && Math.random() < dt * 9) {
				const a = r.dir + Math.PI + rand(-1, 1);
				drops.push({ x: r.x, y: r.y, vx: Math.cos(a) * rand(30, 90), vy: Math.sin(a) * rand(30, 90), life: 1 });
			}
		}

		// 脚の付け根 [前後位置, 基本角度（度）, 長さ]
		const LEGS = [[8, 52, 15], [1, 88, 17], [-7, 128, 20]];
		function draw(r) {
			const s = r.size;
			ctx.save();
			ctx.translate(r.x, r.y);
			ctx.rotate(r.dir);
			ctx.scale(s, s);
			// 走っている時は体を小刻みに揺らす
			const wob = Math.sin(r.gait * 2) * 0.05 * Math.min(1, r.speed / 80);
			ctx.rotate(wob);

			// 影
			ctx.fillStyle = "rgba(60,40,10,.18)";
			ctx.beginPath(); ctx.ellipse(-3, 4, 21, 11, 0, 0, 7); ctx.fill();

			// 脚（左右 3 本ずつ。対角の 3 本が同時に動く三脚歩行）
			ctx.strokeStyle = r.body;
			ctx.lineCap = ctx.lineJoin = "round";
			const moving = Math.min(1, r.speed / 60);
			for (let side = -1; side <= 1; side += 2) {
				LEGS.forEach(([lx, deg, len], i) => {
					const phase = r.gait + ((i + (side > 0 ? 1 : 0)) % 2) * Math.PI;
					const swing = Math.sin(phase) * 0.45 * moving;
					const a = (deg * Math.PI / 180 - swing) * side;
					const kx = lx + Math.cos(a) * len * 0.5, ky = side * 6 + Math.sin(a) * len * 0.5;
					// ひざから先は後ろ向きに折れる
					const a2 = a + side * 0.75;
					const fx = kx + Math.cos(a2) * len * 0.65, fy = ky + Math.sin(a2) * len * 0.65;
					ctx.lineWidth = 2.2;
					ctx.beginPath(); ctx.moveTo(lx, side * 5); ctx.lineTo(kx, ky); ctx.stroke();
					ctx.lineWidth = 1.3;
					ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
				});
			}

			// 触角（ぴょこぴょこ動く）
			ctx.lineWidth = 1;
			for (let side = -1; side <= 1; side += 2) {
				const w = Math.sin(r.ant + side) * 5;
				ctx.beginPath();
				ctx.moveTo(17, side * 3);
				ctx.quadraticCurveTo(28, side * (8 + w * 0.5), 38 - r.fear * 6, side * (13 + w));
				ctx.stroke();
			}

			// おなか（はね）
			ctx.fillStyle = r.body;
			ctx.beginPath(); ctx.ellipse(-6, 0, 17, 9.5, 0, 0, 7); ctx.fill();
			ctx.fillStyle = r.shell;
			ctx.beginPath(); ctx.ellipse(-6, -4.4, 15, 4.6, 0.06, 0, 7); ctx.fill();
			ctx.beginPath(); ctx.ellipse(-6, 4.4, 15, 4.6, -0.06, 0, 7); ctx.fill();
			// つや
			ctx.fillStyle = "rgba(255,255,255,.28)";
			ctx.beginPath(); ctx.ellipse(-4, -5.2, 9, 1.5, 0.06, 0, 7); ctx.fill();
			// 胸
			ctx.fillStyle = r.shell;
			ctx.beginPath(); ctx.ellipse(10, 0, 7.5, 8.5, 0, 0, 7); ctx.fill();
			ctx.strokeStyle = r.body;
			ctx.lineWidth = 1;
			ctx.stroke();
			// 頭
			ctx.fillStyle = r.body;
			ctx.beginPath(); ctx.ellipse(17.5, 0, 5, 6, 0, 0, 7); ctx.fill();

			// ぎょろ目（瞳はマウスの方を見る。怖いと大きくなる）
			const er = 3.6 + r.fear * 1.6;
			let look = 0, lookD = 0.6;
			if (mouse.on) {
				look = wrap(Math.atan2(mouse.y - r.y, mouse.x - r.x) - r.dir);
				lookD = 1.5;
			}
			for (let side = -1; side <= 1; side += 2) {
				const ex = 19, ey = side * 4.2;
				ctx.fillStyle = "#fff";
				ctx.strokeStyle = "#2a1a0a";
				ctx.lineWidth = 0.7;
				ctx.beginPath(); ctx.arc(ex, ey, er, 0, 7); ctx.fill(); ctx.stroke();
				ctx.fillStyle = "#1a1008";
				ctx.beginPath();
				ctx.arc(ex + Math.cos(look) * lookD, ey + Math.sin(look) * lookD, r.fear > 0.5 ? 1.1 : 1.7, 0, 7);
				ctx.fill();
			}
			ctx.restore();
		}

		// ---- メインループ ----
		let last = performance.now();
		function frame(now) {
			requestAnimationFrame(frame);
			if (!cv.width || !cv.height) { resize(); return; }
			const dt = Math.min(0.05, (now - last) / 1000);
			last = now;
			ctx.setTransform(1, 0, 0, 1, 0, 0);
			ctx.drawImage(floor, 0, 0);
			ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

			for (const r of roaches) update(r, dt);
			// 奥（上）から順に描く
			roaches.sort((a, b) => a.y - b.y);
			for (const r of roaches) draw(r);

			// 冷や汗
			for (let i = drops.length - 1; i >= 0; i--) {
				const d = drops[i];
				d.life -= dt * 2.2;
				if (d.life <= 0) { drops.splice(i, 1); continue; }
				d.x += d.vx * dt; d.y += d.vy * dt;
				ctx.fillStyle = `rgba(90,180,255,${d.life})`;
				ctx.beginPath(); ctx.arc(d.x, d.y, 1.2 + d.life * 2, 0, 7); ctx.fill();
			}
			// 衝撃波
			for (let i = rings.length - 1; i >= 0; i--) {
				const g = rings[i];
				g.life -= dt * 1.8;
				g.r += dt * 700;
				if (g.life <= 0) { rings.splice(i, 1); continue; }
				ctx.strokeStyle = `rgba(230,90,60,${g.life * 0.6})`;
				ctx.lineWidth = 6 * g.life;
				ctx.beginPath(); ctx.arc(g.x, g.y, g.r, 0, 7); ctx.stroke();
			}
		}

		window.addEventListener("resize", resize);
		if (window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);
		resize();
		setCount(18);
		requestAnimationFrame(frame);
	</script>
</body>
</html>
